<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Chip That Hums</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="./runtime/fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=block">
<style>
:root {
  --paper: #F6F1E7;
  --paper-2: #ECE4D6;
  --ink: #26272B;
  --ink-soft: #5E5F66;
  --rule: #D9D0C1;
  --accent: #D9573B;
  --accent-ink: #B23F25;
  --accent-soft: #F6D9CF;
  --input: #2F7F7A;
  --input-soft: #D3E7E4;
  --sans: "Geist", "Inter", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --serif: "Instrument Serif", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#main { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 500; }
.scene, .cam, .layer { position: absolute; inset: 0; }
.layer svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
.reveal { --p: 0; --x0: 0px; --w: 1920px; clip-path: inset(-2000px calc(1920px - var(--x0) - var(--p) * var(--w)) -2000px -2000px); }
.lbl { position: absolute; font-family: var(--mono); font-size: 52px; line-height: 62px; white-space: pre; color: var(--ink); }
.lbl.s { font-size: 48px; line-height: 58px; color: var(--ink-soft); }
.lbl.acc { color: var(--accent-ink); }
.lbl.ok { color: var(--input); }
.lbl.big { font-size: 80px; line-height: 96px; }
.lbl.m { font-size: 48px; line-height: 58px; }
.note { position: absolute; font-family: var(--serif); font-style: italic; font-size: 64px; line-height: 76px; white-space: pre; color: var(--ink-soft); }
.note.acc { color: var(--accent-ink); }
.note.big { font-size: 96px; line-height: 110px; color: var(--accent-ink); }
</style>
</head>
<body>
<div id="main"></div>

<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const SCHEDULE = /*SCHEDULE*/null;
const FPS = 30;
const M = Motion.film({ fps: FPS, duration: SCHEDULE.duration, width: 1920, height: 1080, clock: 'smooth' });
const C = { ink: '#26272B', soft: '#5E5F66', rule: '#D9D0C1', accent: '#D9573B', accentInk: '#B23F25', accentSoft: '#F6D9CF', input: '#2F7F7A', inputSoft: '#D3E7E4', paper: '#F6F1E7', paper2: '#ECE4D6' };
const main = document.getElementById('main');
const LEAD = 9;
const END = Math.round(SCHEDULE.duration * FPS);
const lineStart = i => SCHEDULE.lines[i - 1].start_frame;
const sceneStart = i => Math.max(0, lineStart(i) - LEAD);
const sceneEnd = i => i < SCHEDULE.lines.length ? sceneStart(i + 1) : END;
const MISSES = [];
const word = (i, forms, nth = 0) => {
  const fs = [].concat(forms);
  const hits = SCHEDULE.lines[i - 1].words.filter(w => { const t = w.word.toLowerCase().replace(/[^a-z0-9.,%'−-]/g, '').replace(/[.,]+$/, ''); return fs.some(f => t === f); });

  return (hits[nth] || hits[hits.length - 1] || { frame: lineStart(i) }).frame - 2;
};
let uid = 0;

const range = (a, b, s = 1) => { const o = []; for (let v = a; v <= b + 1e-9; v += s) o.push(v); return o; };
const path = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
const cosd = a => Math.cos(a * Math.PI / 180), sind = a => Math.sin(a * Math.PI / 180);
const pt = (cx, cy, R, a) => [cx + R * cosd(a), cy - R * sind(a)];
const arcD = (cx, cy, r, a0, a1) => {
  const dir = a1 >= a0 ? 1 : -1, sweep = dir > 0 ? 0 : 1;
  let a = a0, d = 'M' + pt(cx, cy, r, a0).map(v => v.toFixed(1)).join(' ');

};

function el(tag, attrs, parent, html) { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html !== undefined) e.innerHTML = html; parent.appendChild(e); return e; }

SCENES.forEach(id => { const s = el('section', { id, class: 'scene' }, main); el('div', { id: id + 'cam', class: 'cam' }, s); });
const cam = n => document.getElementById(`s${n}cam`);
function sub(parent) { const id = 'P' + (++uid); el('div', { id, class: 'layer' }, parent); return document.getElementById(id); }

}

const reveal = (sel, a, b, ease = 'softInOut') => M.kf(sel, '--p', [[0, 0], [a, 0], [b, 1, ease]]);

const vline = (x, y1, y2, color = C.soft, w = 3, dash = '') => `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${color}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const seg = (x1, y1, x2, y2, color = C.ink, w = 5, dash = '') => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const curve = (pts, color = C.ink, w = 5, dash = '') => `<path d="${path(pts)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;

  xs.forEach(([v, t]) => { layer(c, vline(X(v), Y(y0), Y(y0) + 12, C.ink, 3)); label(c, t, X(v), Y(y0) + 36, 'lbl s', 'center'); });
  ys.forEach(([v, t]) => { layer(c, hline(X(x0) - 12, X(x0), Y(v), C.ink, 3)); label(c, t, X(x0) - 22, Y(v) - 29, 'lbl s', 'right'); });
  if (title) label(c, title, X(x0) - 22, Y(y1) - 112, 'lbl s');
}

const stepped = (c, a, b, stepF, draw) => {
  const n = Math.max(1, Math.floor((b - a) / stepF));
  for (let k = 0; k <= n; k++) { const from = a + k * stepF, to = k === n ? b : a + (k + 1) * stepF; M.show(layer(c, draw(k / n)), from, to > from ? to : from + 1); }
};

const arrowSvg = (x1, y1, x2, y2, color = C.ink, w = 6, dash = '', open = false) => {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 26, s = 13;
  const bx = x2 - h * Math.cos(a), by = y2 - h * Math.sin(a);
  const p1 = [bx + s * Math.sin(a), by - s * Math.cos(a)], p2 = [bx - s * Math.sin(a), by + s * Math.cos(a)];
  return seg(x1, y1, bx, by, color, w, dash) + `<path d="M${x2.toFixed(1)} ${y2.toFixed(1)}L${p1[0].toFixed(1)} ${p1[1].toFixed(1)}L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}Z" fill="${open ? C.paper : color}" stroke="${color}" stroke-width="4" stroke-linejoin="round"/>`;
};
const FS = 8000;
const ang = f => 360 * f / FS;
const polymul = (a, b) => { const o = Array(a.length + b.length - 1).fill(0); a.forEach((x, i) => b.forEach((y, j) => { o[i + j] += x * y; })); return o; };

const multiplied = (fs, r) => fs.reduce(([B, A], f) => { const [b, a] = notch(f, r); return [polymul(B, b), polymul(A, a)]; }, [[1], [1]]);
const quant = (v, s) => Math.round(v / s) * s;
const gainAt = (B, A, f) => {
  const w = 2 * Math.PI * f / FS, ev = P => P.reduce(([re, im], c, k) => [re + c * Math.cos(w * k), im - c * Math.sin(w * k)], [0, 0]);
  const [br, bi] = ev(B), [ar, ai] = ev(A);
  return Math.hypot(br, bi) / Math.hypot(ar, ai);
};
const run = (B, A, x, clip) => {
  const y = new Float64Array(x.length);
  for (let n = 0; n < x.length; n++) {
    let s = 0;
    for (let k = 0; k < B.length; k++) if (n >= k) s += B[k] * x[n - k];
    for (let k = 1; k < A.length; k++) if (n >= k) s -= A[k] * y[n - k];
    y[n] = clip ? Math.max(-1, Math.min(1, s)) : s;
  }
  return y;
};
const roots = A => {

  const div = (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; };
  let z = Array.from({ length: n }, (_, i) => { const r = 0.9, t = 2 * Math.PI * i / n + 0.4; return [r * Math.cos(t), r * Math.sin(t)]; });
  const P = x => A.reduce((acc, c) => { const m = mul(acc, x); return [m[0] + c, m[1]]; }, [0, 0]);
  for (let it = 0; it < 2000; it++) z = z.map((zi, i) => { let d = [1, 0]; z.forEach((zj, j) => { if (j !== i) d = mul(d, [zi[0] - zj[0], zi[1] - zj[1]]); }); const q = div(P(zi), d); return [zi[0] - q[0], zi[1] - q[1]]; });
  return z.map(([re, im]) => ({ r: Math.hypot(re, im), f: Math.atan2(im, re) * FS / (2 * Math.PI) })).filter(p => p.f > 0).sort((a, b) => a.f - b.f);
};
const [LB, LA] = multiplied([1900, 2000, 2100], 0.98);
const CB = LB.map(v => quant(v, 1 / 32)), CA = LA.map((v, i) => (i ? quant(v, 1 / 32) : 1));
const LP = roots(LA), CP = roots(CA);
const CLICK = Float64Array.from({ length: 260 }, (_, n) => (n === 0 ? 0.1 : 0));
const YL = run(LB, LA, CLICK, false), YC = run(CB, CA, CLICK, true);
const FIRST_CLIP = YC.findIndex(v => Math.abs(v) >= 1);
const SECS = [1900, 2000, 2100].map(f => { const [b, a] = notch(f, 0.98); return [b.map(v => quant(v / b[0], 1 / 64)), a.map((v, i) => (i ? quant(v, 1 / 64) : 1))]; });

const SK = quant(SA.reduce((s, v) => s + v, 0) / SB.reduce((s, v) => s + v, 0), 1 / 128);
const SBK = SB.map(v => v * SK);
const SECP = Math.sqrt(SECS[0][1][2]);
const pct = v => (100 * v).toFixed(1).replace(/\.0$/, '') + '%';
const fmt = (v, d) => v.toFixed(d);
const thou = v => Math.round(v).toLocaleString('en-US');
const travel = (c, a, b, y, x0, x1, boxes) => stepped(c, a, b, 2, p => { const fr = a + p * (b - a), q = ((fr - a) % 60) / 60, x = x0 + (x1 - x0) * q; return boxes.some(([u, v]) => x > u - 14 && x < v + 14) ? '' : `<circle cx="${x.toFixed(1)}" cy="${y}" r="12" fill="${C.ink}"/>`; });
const swell = (c, a, b, pts) => stepped(c, a, b, 2, p => { const fr = a + p * (b - a), q = ((fr - a) % 36) / 36; return pts.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(24 + 30 * q).toFixed(1)}" fill="none" stroke="${C.accent}" stroke-width="6" opacity="${(1 - q).toFixed(2)}"/>`).join(''); });
const laptopPole = (x, y, s = 11) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${s + 9}" fill="none" stroke="${C.soft}" stroke-width="3" stroke-dasharray="6 5"/>` + seg(x - s, y - s, x + s, y + s, C.soft, 4) + seg(x - s, y + s, x + s, y - s, C.soft, 4);

{
  const c = cam(1);
  const ni = word(1, ['nineteen', '1900', '1,900', '19']), tw = word(1, ['two', '2000', '2,000', '2']), te = word(1, ['twenty', '2100', '2,100', '21']), no = word(1, 'notches'), mu = word(1, 'multiplies'), ru = word(1, 'rule');

  const X = f => 300 + (f - 1500) * 1.3, Y = g => 600 - g * 300;
  axes(c, X, Y, [[1500, '1,500'], [2000, '2,000'], [2500, '2,500 Hz']], [[0, '0%'], [1, '100%']], 1500, 2500, 0, 1.05, '');
  label(c, 'gain', X(1500) - 22, Y(1.05) - 90, 'lbl s');

  const whines = [[1900, ni], [2000, tw], [2100, te]];
  whines.forEach(([f, at]) => { M.show(layer(c, vline(X(f), Y(1.05), Y(0), C.accent, 3, '6 8')), at + 15); M.show(label(c, thou(f), X(f), Y(1.05) - (f === 2000 ? 130 : 75), 'lbl s acc', 'center'), at + 15); });
  stepped(c, ni + 15, sceneEnd(1), 3, p => { const fr = ni + 15 + p * (sceneEnd(1) - ni - 15); const k = fr < tw + 15 ? 0 : fr < te + 15 ? 1 : fr < te + 45 ? 2 : Math.floor(rnd(Math.floor(fr / 9) + 3) * 3); const x = X([1900, 2000, 2100][k]); return `<rect x="${x - 22}" y="${Y(1.05)}" width="44" height="${Y(0) - Y(1.05)}" fill="${C.accent}" opacity="0.22"/><path d="M${x - 18} ${Y(1.05) - 10}L${x + 18} ${Y(1.05) - 10}L${x} ${Y(1.05) + 10}Z" fill="${C.accent}"/>`; });
