<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Detector That Couldn’t Keep Up</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="./runtime/fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=block">
<style>
:root {
  --paper: #F6F1E7;
  --paper-2: #ECE4D6;
  --ink: #26272B;
  --ink-soft: #5E5F66;
  --rule: #D9D0C1;
  --accent: #D9573B;
  --accent-ink: #B23F25;
  --accent-soft: #F6D9CF;
  --input: #2F7F7A;
  --input-soft: #D3E7E4;
  --sans: "Geist", "Inter", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --serif: "Instrument Serif", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#main { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 500; }
.scene, .cam, .layer { position: absolute; inset: 0; }
.layer svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
.reveal { --p: 0; --x0: 0px; --w: 1920px; clip-path: inset(-2000px calc(1920px - var(--x0) - var(--p) * var(--w)) -2000px -2000px); }
.lbl { position: absolute; font-family: var(--mono); font-size: 52px; line-height: 62px; white-space: pre; color: var(--ink); }
.lbl.s { font-size: 48px; line-height: 58px; color: var(--ink-soft); }
.lbl.acc { color: var(--accent-ink); }
.lbl.ok { color: var(--input); }
.lbl.big { font-size: 80px; line-height: 96px; }
.lbl.m { font-size: 48px; line-height: 58px; }
.note { position: absolute; font-family: var(--serif); font-style: italic; font-size: 64px; line-height: 76px; white-space: pre; color: var(--ink-soft); }
.note.acc { color: var(--accent-ink); }
.note.big { font-size: 96px; line-height: 110px; color: var(--accent-ink); }
</style>
</head>
<body>
<div id="main"></div>

<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const SCHEDULE = /*SCHEDULE*/null;
const FPS = 30;
const M = Motion.film({ fps: FPS, duration: SCHEDULE.duration, width: 1920, height: 1080, clock: 'smooth' });
const C = { ink: '#26272B', soft: '#5E5F66', rule: '#D9D0C1', accent: '#D9573B', accentInk: '#B23F25', accentSoft: '#F6D9CF', input: '#2F7F7A', inputSoft: '#D3E7E4', paper: '#F6F1E7', paper2: '#ECE4D6' };
const main = document.getElementById('main');
const LEAD = 9;
const END = Math.round(SCHEDULE.duration * FPS);
const lineStart = i => SCHEDULE.lines[i - 1].start_frame;
const sceneStart = i => Math.max(0, lineStart(i) - LEAD);
const sceneEnd = i => i < SCHEDULE.lines.length ? sceneStart(i + 1) : END;
const MISSES = [];
const word = (i, forms, nth = 0) => {
  const fs = [].concat(forms);
  const hits = SCHEDULE.lines[i - 1].words.filter(w => { const t = w.word.toLowerCase().replace(/[^a-z0-9.,%'−-]/g, '').replace(/[.,:?!]+$/, ''); return fs.includes(t); });
  if (!hits[nth]) MISSES.push(`${i}:${fs[0]}:${nth}`);
  return (hits[nth] || hits[hits.length - 1] || { frame: lineStart(i) }).frame - 2;
};
let uid = 0;

const range = (a, b, s = 1) => { const o = []; for (let v = a; v <= b + 1e-9; v += s) o.push(v); return o; };
const path = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
const cosd = a => Math.cos(a * Math.PI / 180), sind = a => Math.sin(a * Math.PI / 180);
const pt = (cx, cy, R, a) => [cx + R * cosd(a), cy - R * sind(a)];
const arcD = (cx, cy, r, a0, a1) => {
  const dir = a1 >= a0 ? 1 : -1, sweep = dir > 0 ? 0 : 1;
  let a = a0, d = 'M' + pt(cx, cy, r, a0).map(v => v.toFixed(1)).join(' ');
  while (Math.abs(a1 - a) > 1e-9) { const b = dir > 0 ? Math.min(a + 170, a1) : Math.max(a - 170, a1); d += `A${r} ${r} 0 0 ${sweep} ${pt(cx, cy, r, b).map(v => v.toFixed(1)).join(' ')}`; a = b; }
  return d;
};

function el(tag, attrs, parent, html) { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html !== undefined) e.innerHTML = html; parent.appendChild(e); return e; }
const SCENES = Array.from({ length: SCHEDULE.lines.length }, (_, i) => 's' + (i + 1));
SCENES.forEach(id => { const s = el('section', { id, class: 'scene' }, main); el('div', { id: id + 'cam', class: 'cam' }, s); });
const cam = n => document.getElementById(`s${n}cam`);
function sub(parent) { const id = 'P' + (++uid); el('div', { id, class: 'layer' }, parent); return document.getElementById(id); }
function layer(parent, inner, reveal) {
  const id = 'L' + (++uid), d = el('div', { id, class: 'layer' + (reveal ? ' reveal' : '') }, parent);
  if (reveal) { d.style.setProperty('--x0', reveal[0] + 'px'); d.style.setProperty('--w', (reveal[1] - reveal[0]) + 'px'); }
  d.innerHTML = `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  return '#' + id;
}
function label(parent, text, x, y, cls = 'lbl', anchor = 'left') {
  const id = 'T' + (++uid), e = el('div', { id, class: cls }, parent); e.textContent = text; e.style.top = y + 'px';
  if (anchor === 'left') e.style.left = x + 'px'; else if (anchor === 'right') e.style.right = (1920 - x) + 'px'; else { e.style.left = (x - 900) + 'px'; e.style.width = '1800px'; e.style.textAlign = 'center'; }
  return '#' + id;
}
const reveal = (sel, a, b, ease = 'softInOut') => M.kf(sel, '--p', [[0, 0], [a, 0], [b, 1, ease]]);
const origin = (sel, x, y) => { document.querySelector(sel).style.transformOrigin = `${x}px ${y}px`; };
const drift = (n, a = 1, b = 1.03) => M.drift(`#s${n}cam`, { prop: 'scale', from: a, to: b, start: sceneStart(n), end: sceneEnd(n) });
const grow = (sel, x, y, at, len = 8) => { origin(sel, x, y); M.show(sel, at); M.kf(sel, 'scaleY', [[0, 0], [at, 0], [at + len, 1, 'softLand']]); return sel; };
const fadeIn = (sel, at, len = 10) => { M.show(sel, at); M.kf(sel, 'opacity', [[0, 0], [at, 0], [at + len, 1]]); return sel; };

const hline = (x1, x2, y, color = C.soft, w = 3, dash = '') => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const vline = (x, y1, y2, color = C.soft, w = 3, dash = '') => `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${color}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const seg = (x1, y1, x2, y2, color = C.ink, w = 5, dash = '') => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const curve = (pts, color = C.ink, w = 5, dash = '') => `<path d="${path(pts)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const DASH = '16 11', DASHDOT = '26 10 6 10', DOTS = '2 12';
const stemSvg = (x, base, y, color = C.ink, w = 7, r = 15) => `<line x1="${x.toFixed(1)}" y1="${base}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${color}"/>`;
const zeroSvg = (x, y, r = 20, color = C.ink) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${C.paper}" stroke="${color}" stroke-width="6"/>`;
const poleSvg = (x, y, s = 18, color = C.ink) => seg(x - s, y - s, x + s, y + s, color, 7) + seg(x - s, y + s, x + s, y - s, color, 7);
const dotSvg = (x, y, r = 16, color = C.ink) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${color}"/>`;
const ringSvg = (x, y, r = 16, color = C.ink, w = 5) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${C.paper}" stroke="${color}" stroke-width="${w}"/>`;
function tick(c, x, y, s = 1) { return layer(c, `<path d="M ${x} ${y} l ${16 * s} ${18 * s} l ${34 * s} ${-40 * s}" fill="none" stroke="${C.input}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`); }
const rnd = k => { const v = Math.sin(k * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
const flicker = (sel, x, y, a, b, lo = 0.8, seed = 0) => { const keys = [[0, 1], [a, 1]]; for (let f = a + 2; f < b - 2; f += 2) keys.push([f, lo + (1 - lo) * rnd(f + seed)]); keys.push([b, 1]); M.kf(sel, 'opacity', keys); };
const bracket = (x1, x2, y, color = C.accent, h = 16, w = 5) => `<path d="M${x1.toFixed(1)} ${y - h}V${y}H${x2.toFixed(1)}V${y - h}" fill="none" stroke="${color}" stroke-width="${w}"/>`;
function axes(c, X, Y, xs, ys, x0, x1, y0, y1, title) {
  layer(c, hline(X(x0), X(x1) + 20, Y(y0), C.ink, 3) + vline(X(x0), Y(y0), Y(y1) - 20, C.ink, 3));
  xs.forEach(([v, t]) => { layer(c, vline(X(v), Y(y0), Y(y0) + 12, C.ink, 3)); label(c, t, X(v), Y(y0) + 36, 'lbl s', 'center'); });
  ys.forEach(([v, t]) => { layer(c, hline(X(x0) - 12, X(x0), Y(v), C.ink, 3)); label(c, t, X(x0) - 22, Y(v) - 29, 'lbl s', 'right'); });
  if (title) label(c, title, X(x0) - 22, Y(y1) - 112, 'lbl s');
}

const turnHz = f => 360 * f / 8000;
const FS = 8000;
const ROWS = [697, 770, 852, 941], COLS = [1209, 1336, 1477, 1633];
const arrowSvg = (x1, y1, x2, y2, color = C.ink, w = 6, dash = '', open = false) => {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 26, s = 13;
  const bx = x2 - h * Math.cos(a), by = y2 - h * Math.sin(a);
  const p1 = [bx + s * Math.sin(a), by - s * Math.cos(a)], p2 = [bx - s * Math.sin(a), by + s * Math.cos(a)];
  return seg(x1, y1, bx, by, color, w, dash) + `<path d="M${x2.toFixed(1)} ${y2.toFixed(1)}L${p1[0].toFixed(1)} ${p1[1].toFixed(1)}L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}Z" fill="${open ? C.paper : color}" stroke="${color}" stroke-width="4" stroke-linejoin="round"/>`;
};
const stepped = (c, a, b, stepF, draw) => {
  const n = Math.max(1, Math.floor((b - a) / stepF));
  for (let k = 0; k <= n; k++) { const from = a + k * stepF, to = k === n ? b : a + (k + 1) * stepF; M.show(layer(c, draw(k / n)), from, to > from ? to : from + 1); }
};
const anim = (c, a, b, draw, stepF = 2) => stepped(c, a, b, stepF, p => draw(a + p * (b - a)));
const stemsSvg = (x0, sp, y, vals, amp, color = C.ink, hollowNeg = false) => hline(x0 - 34, x0 + (vals.length - 1) * sp + 34, y, C.rule, 2) + vals.map((v, n) => {
  const x = x0 + n * sp;
  if (Math.abs(v) < 1e-9) return ringSvg(x, y, 8, C.soft, 4);
  const yy = y - amp * v;
  return `<line x1="${x}" y1="${y}" x2="${x}" y2="${yy.toFixed(1)}" stroke="${color}" stroke-width="6"/>` + (hollowNeg && v < 0 ? ringSvg(x, yy, 13, color, 5) : dotSvg(x, yy, 13, color));
}).join('');
const fmt2 = v => (Math.abs(v) < 0.005 ? 0 : v).toFixed(2).replace('-', '−');
const keyBeep = n => Math.cos(2 * Math.PI * 770 * n / FS) + Math.cos(2 * Math.PI * 1336 * n / FS);
const matchOf = (x, k, N) => { let re = 0, im = 0; for (let n = 0; n < N; n++) { re += x(n) * Math.cos(2 * Math.PI * k * n / N); im -= x(n) * Math.sin(2 * Math.PI * k * n / N); } return Math.hypot(re, im); };
const nearestBin = (f, N) => Math.round(f * N / FS);
const KEYBINS = [...ROWS, ...COLS].map(f => nearestBin(f, 205));
const KEY5 = KEYBINS.map(k => matchOf(keyBeep, k, 205) / 102.5);
const pct = v => Math.round(v * 100) + '%';
const wheelSvg = (cx, cy, R, dashed = false) => `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${C.ink}" stroke-width="4"${dashed ? ` stroke-dasharray="${DASH}"` : ''}/>` + range(0, 7).map(k => dotSvg(...pt(cx, cy, R, -45 * k), 7, C.soft)).join('') + `<path d="${arcD(cx, cy, R + 36, 60, 10)}" fill="none" stroke="${C.soft}" stroke-width="4"/>` + arrowSvg(...pt(cx, cy, R + 36, 14), ...pt(cx, cy, R + 36, -4), C.soft, 4);
const RIGHT = 1790, TOP = 76, LEFT = 140;
const beepSvg = (x0, sp, y, amp, r) => hline(x0, x0 + 204 * sp, y, C.rule, 2) + curve(range(0, 204).map(n => [x0 + n * sp, y - amp * keyBeep(n)]), C.ink, 4) + range(0, 204).map(n => dotSvg(x0 + n * sp, y - amp * keyBeep(n), r, C.ink)).join('');
{
  const c = cam(1);
  const fo = word(1, '42'), po = word(1, '1'), ma = word(1, 'manages'), fa = word(1, 'falls');
  M.show(label(c, 'the detector: every bin, every block', 960, TOP, 'note', 'center'), word(1, 'every'));
  const tr = layer(c, beepSvg(200, 7.4, 215, 28, 6));
  flicker(tr, 960, 215, 0, sceneEnd(1), 0.75, 13);
  M.show(label(c, '103 bins × 205 samples × 2 = 42,230 a block', 960, 290, 'lbl', 'center'), fo);
  M.show(label(c, '× 2: two multiplications per sample arrow', 960, 360, 'lbl s', 'center'), fo + 12);
  M.show(label(c, '× 39 blocks a second = 1.65 million a second', 960, 430, 'lbl', 'center'), po);
  const BX = v => 300 + v * 700;
  M.show(label(c, 'needed: 1.65 million a second', 300, 510, 'lbl acc'), po + 10);
  const need = layer(c, `<rect x="${BX(0)}" y="585" width="${BX(1.65) - BX(0)}" height="70" fill="${C.accent}"/>`, [BX(0) - 4, BX(1.65) + 4]);
  reveal(need, po + 6, po + 30, 'cruise');
  flicker(need, BX(0), 620, po + 30, sceneEnd(1), 0.6, 17);
  M.show(label(c, 'chip: about 1 million', 1040, 776, 'lbl'), ma);
  M.show(layer(c, `<rect x="${BX(0)}" y="770" width="${BX(1) - BX(0)}" height="70" fill="none" stroke="${C.ink}" stroke-width="5"/>` + vline(BX(1), 575, 850, C.ink, 4, DASH)), ma);
  M.show(label(c, 'falls behind', RIGHT, 664, 'lbl big acc', 'right'), fa);
  drift(1);
}
{
  const c = cam(2);
  const di = word(2, 'different'), ei = word(2, 'eight'), bk = word(2, 'back'), f5 = word(2, "5's"), ev = word(2, 'even'), od = word(2, 'odd');
  M.show(label(c, '42,230 different things?', RIGHT, TOP, 'note', 'right'), di);
  M.show(label(c, 'a block of 8 samples', LEFT, TOP, 'lbl'), ei);
  const W1 = [280, 430], W5 = [700, 430], R = 140;
  layer(c, wheelSvg(...W1, R));
  M.show(layer(c, wheelSvg(...W5, R, true)), f5);
  M.show(label(c, 'bin 1', W1[0], 610, 'lbl', 'center'), ei);
  M.show(label(c, '45° back', W1[0], 676, 'lbl s', 'center'), bk);
  M.show(label(c, 'bin 5', W5[0], 610, 'lbl', 'center'), f5);
  M.show(label(c, '225° back', W5[0], 676, 'lbl s', 'center'), f5 + 4);
  const S = Math.max(8, Math.floor((ev - bk) / 8));
  const nAt = f => Math.min(7, Math.max(0, Math.floor((f - bk) / S)));
  anim(c, sceneStart(2), sceneEnd(2), f => { const n = nAt(f); return arrowSvg(...W1, ...pt(...W1, R - 8, -45 * n), C.ink, 8) + (f >= f5 ? arrowSvg(...W5, ...pt(...W5, R - 8, -225 * n), C.ink, 8, '14 9') : ''); }, 2);
  const TX = n => 1120 + n * 90, Y1 = 340, Y5 = 480;
  M.show(label(c, 'n', 1040, 181, 'lbl s', 'right'), bk);
  M.show(label(c, 'bin 1', 1040, Y1 - 31, 'lbl s', 'right'), bk);
  M.show(label(c, 'bin 5', 1040, Y5 - 31, 'lbl s', 'right'), f5);
  range(0, 7).forEach(n => {
    const at = bk + S * n, x = TX(n);
    M.show(layer(c, `<rect x="${x - 42}" y="240" width="84" height="320" rx="8" fill="${n % 2 ? C.accentSoft : C.inputSoft}"/>`), n % 2 ? od : ev);
    M.show(label(c, String(n), x, 181, 'lbl s', 'center'), at);
    M.show(layer(c, arrowSvg(x - 34 * cosd(-45 * n), Y1 + 34 * sind(-45 * n), x + 34 * cosd(-45 * n), Y1 - 34 * sind(-45 * n), C.ink, 5)), at);
    M.show(layer(c, arrowSvg(x - 34 * cosd(-225 * n), Y5 + 34 * sind(-225 * n), x + 34 * cosd(-225 * n), Y5 - 34 * sind(-225 * n), C.ink, 5, '9 6')), Math.max(at, f5));
  });
  M.show(label(c, 'even n: the same way', 1078, 610, 'lbl ok'), ev);
  M.show(label(c, 'odd n: opposite', 1078, 690, 'lbl acc'), od);
  drift(2);
}
{
  const c = cam(3);
  const ev = word(3, 'even'), od = word(3, 'odd', 0), pl = word(3, 'plus'), mi = word(3, 'minus'), pr = word(3, 'price');
  const SX = n => 300 + n * 190, SY = 180;
  range(0, 7).forEach(n => {
    layer(c, `<rect x="${SX(n) - 70}" y="${SY}" width="140" height="80" rx="10" fill="none" stroke="${C.ink}" stroke-width="${n % 2 ? 3 : 5}"${n % 2 ? ` stroke-dasharray="10 7"` : ''}/>`);
    label(c, `x[${n}]`, SX(n), SY + 9, 'lbl', 'center');
  });
  const E = [560, 430], O = [1360, 430];
  const box = (x, y, w, solid) => `<rect x="${x - w / 2}" y="${y}" width="${w}" height="90" rx="12" fill="${C.paper}" stroke="${C.ink}" stroke-width="${solid ? 5 : 3}"${solid ? '' : ` stroke-dasharray="10 7"`}/>`;
  M.show(layer(c, [0, 2, 4, 6].map(n => seg(SX(n), SY + 84, E[0], E[1] - 4, C.ink, 4)).join('') + box(E[0], E[1], 420, true)), ev);
  M.show(label(c, 'even part', E[0], E[1] + 14, 'lbl', 'center'), ev);
  M.show(layer(c, [1, 3, 5, 7].map(n => seg(SX(n), SY + 84, O[0], O[1] - 4, C.soft, 4, '10 8')).join('') + box(O[0], O[1], 420, false)), od);
  M.show(label(c, 'odd part', O[0], O[1] + 14, 'lbl', 'center'), od);
  M.show(label(c, 'turned, added once', E[0], 550, 'lbl s', 'center'), ev + 10);
  M.show(label(c, 'turned, added once', O[0], 550, 'lbl s', 'center'), od + 10);
  M.show(label(c, 'bin 1 = even + odd', 960, 650, 'lbl big', 'center'), pl);
  M.show(label(c, 'bin 5 = even − odd', 960, 760, 'lbl big', 'center'), mi);
  M.show(label(c, 'two bins, one price', RIGHT, TOP, 'note', 'right'), pr);
  drift(3);
}
{
  const c = cam(4);
  const on = word(4, '1', 1), ev = word(4, 'even'), od = word(4, 'odd'), wa = word(4, 'walk'), la = word(4, 'later'), tu = word(4, 'turn'), po = word(4, '.83');
  const rec = [1, 1, 0, -1, -1, -1, 0, 1];
  M.show(label(c, 'a rough 1,000 Hz tone', LEFT, TOP, 'lbl s'), word(4, 'rough'));
  const RX = n => 220 + n * 95;
  layer(c, stemsSvg(RX(0), 95, 260, rec, 80));
  range(0, 7).forEach(n => M.show(label(c, rec[n] < 0 ? '−1' : String(rec[n]), RX(n), 370, 'lbl s', 'center'), on + 3 * n));
  M.show(label(c, 'even: 1, 0, −1, 0', LEFT, 490, 'lbl'), ev);
  M.show(label(c, 'odd: 1, −1, −1, 1', LEFT, 690, 'lbl'), od);
  M.show(label(c, 'turned:', LEFT, 771, 'lbl s'), wa);
  [[1, 0], [0, 1], [1, 0], [0, 1]].forEach(([dx, dy], i) => M.show(layer(c, arrowSvg(420 + i * 110 - 30 * dx, 800 + 30 * dy, 420 + i * 110 + 30 * dx, 800 - 30 * dy, C.ink, 5)), wa + 6 * i));
  const U = 110, ex = 1150, ey = 340;
  M.show(layer(c, arrowSvg(ex, ey, ex + 2 * U, ey, C.ink, 8)), ev + 6);
  M.show(label(c, 'even part: 2 →', ex, ey - 100, 'lbl ok'), ev + 6);
  const ox = 1150, oy = 830;
  const walk = [[1, 0], [0, 1], [1, 0], [0, 1]];
