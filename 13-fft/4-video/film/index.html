-two thousand different things? Take a block of eight. Bin one's test wheel turns back forty-five degrees a sample, bin five's two hundred and twenty-five. On the even samples they point the same way. On the odd ones, exactly opposite.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/13-fft/4-video/vo/line02.wav","at":15.51,"start":15.51,"end":27.93,"start_frame":465,"words":[{"word":"Is","frame":465},{"word":"the","frame":474},{"word":"DFT","frame":477},{"word":"really","frame":488},{"word":"doing","frame":496},{"word":"42","frame":503},{"word":",000","frame":513},{"word":"different","frame":527},{"word":"things?","frame":532},{"word":"Take","frame":556},{"word":"a","frame":558},{"word":"block","frame":560},{"word":"of","frame":566},{"word":"eight.","frame":570},{"word":"Bin","frame":590},{"word":"1's","frame":594},{"word":"test","frame":602},{"word":"wheel","frame":606},{"word":"turns","frame":614},{"word":"back","frame":621},{"word":"45","frame":628},{"word":"degrees","frame":640},{"word":"a","frame":652},{"word":"sample,","frame":657},{"word":"bin","frame":670},{"word":"5's","frame":675},{"word":"225.","frame":684},{"word":"On","frame":724},{"word":"the","frame":729},{"word":"even","frame":731},{"word":"samples","frame":737},{"word":"they","frame":748},{"word":"point","frame":753},{"word":"the","frame":759},{"word":"same","frame":764},{"word":"way,","frame":769},{"word":"on","frame":778},{"word":"the","frame":781},{"word":"odd","frame":784},{"word":"ones,","frame":790},{"word":"exactly","frame":802},{"word":"opposite.","frame":816}]},{"line":3,"text":"So add up the turned even samples once: the even part. Then the odd ones: the odd part. Bin one is even plus odd, bin five is even minus odd. Two bins for the price of one.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/13-fft/4-video/vo-breath/line03.wav","at":28.43,"start":28.43,"end":37.35,"start_frame":853,"words":[{"word":"So","frame":853},{"word":"add","frame":862},{"word":"up","frame":868},{"word":"t ord":"is","frame":1306},{"word":"2,","frame":1310},{"word":"pointing","frame":1320},{"word":"right.","frame":1326},{"word":"The","frame":1342},{"word":"odd","frame":1343},{"word":"samples","frame":1347},{"word":"walk","frame":1357},{"word":"2","frame":1364},{"word":"right","frame":1369},{"word":"and","frame":1375},{"word":"2","frame":1379},{"word":"up,","frame":1384},{"word":"but","frame":1391},{"word":"each","frame":1396},{"word":"sits","frame":1402},{"word":"one","frame":1409},{"word":"sample","frame":1415},{"word":"later,","frame":1425},{"word":"so","frame":1444},{"word":"turn","frame":1446},{"word":"the","frame":1454},{"word":"walk","frame":1459},{"word":"back","frame":1465},{"word":"one","frame":1472},{"word":"more","frame":1480},{"word":"step","frame":1486},{"word":"2","frame":1495},{"word":".83,","frame":1505},{"word":"pointing","frame":1530},{"word":"right.","frame":1535}]},{"line":5,"text":"Bin one is two plus two point eight three: four point eight three. Bin five is two minus two point eight three: minus point eight three. Turn, add, subtract: that step is a butterfly, four multiplications.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/13-fft/4-video/vo-breath/line05.wav","at":52.15,"start":52.15,"end":62.4,"start_frame":1565,"words":[{"word":"Bin","frame":1565},{"word":"1","frame":1574},{"word":"is","frame":1581},{"word":"2","frame":1587},{"word":"plus","frame":1593},{"word":"2","frame":1601},{"word":".83,","frame":1607},{"word":"4","frame":1629},{"word":".83.","frame":1636},{"word":"Bin","frame":1659},{"word":"5","frame":1665},{"word":"is","frame":1671},{"word":"2","frame":1678},{"word":"minus","frame":1683},{"word":"2","frame":1692},{"word":".83,","frame":1699},{"word":"minus","frame":1722},{"word":"0","frame":1725},{"word":".83.","frame":1733},{"word":"Turn,","frame":1765},{"word":"add,","frame":1773},{"word":"subtract.","frame":1781},{"word":"That","frame":1796},{"word":"step","frame":1803},{"word":"is","frame":1809},{"word":"a","frame":1814},{"word":"butterfly","frame":1817},{"word":"for","frame":1828},{"word":"multiplications.","frame":1837}]},{"line":6,"text":"Now the dramatic move. A four-sample DFT is a DFT, so split it too, and again, down to single samples, which cost nothing. Only butterflies are left, three layers of four: forty-eight multiplications instead of a hundred and twenty-eight. That's the FFT, the fast Fourier transform.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/13-fft/4-video/vo/line06.wav","at":63.0,"start":63.0,"end":76.64,"start_frame":1890,"words":[{"word":"now","frame":1890},{"word":"the","frame":1899},{"word":"dramatic","frame":1903},{"word":"move","frame":1912},{"word":"a","frame":1925},{"word":"four","frame":1933},{"word":"sample","frame":1938},{"word":"dft","frame":1948},{"word":"is","frame":1959},{"word":"a","frame":1965},{"word":"dft","frame":1968},{"word":"so","frame":1978},{"word":"split","frame":1987},{"word":"it","frame":1995},{"word":"two","frame":1999},{"word":"and","frame":2006},{"word":"again","frame":2015},{"word":"down","frame":2022},{"word":"to","frame":2034},{"word":"single","frame":2036},{"word":"samples","frame":2042},{"word":"which","frame":2054},{"word":"cost","frame":2062},{"word":"nothing","frame":2071},{"word":"only","frame":2080},{"word":"butterflies","frame":2093},{"word":"are","frame":2105},{"word":"left","frame":2112},{"word":"three","frame":2119},{"word":"layers","frame":2128},{"word":"of","frame":2136},{"word":"four","frame":2141},{"word":"48","frame":2157},{"word":"multiplications","frame":2165},{"word":"instead","frame":2189},{"word":"of","frame":2197},{"word":"128","frame":2200},{"word":"that's","frame":2218},{"word":"the","frame":2233},{"word":"fft","frame":2236},{"word":"the","frame":2249},{"word":"fast","frame":2258},{"word":"fourier","frame":2267},{"word":"transform","frame":2278}]},{"line":7,"text":"Back to the line. The FFT halves the block again and again, so its length must be a power of two, and two hundred and five is five tim d":"is","frame":3312},{"word":"not","frame":3318},{"word":"a","frame":3322},{"word":"rougher","frame":3325},{"word":"DFT,","frame":3332},{"word":"it","frame":3351},{"word":"gives","frame":3353},{"word":"exactly","frame":3358},{"word":"the","frame":3370},{"word":"same","frame":3375},{"word":"bins,","frame":3381},{"word":"still","frame":3392},{"word":"31","frame":3401},{"word":".25","frame":3410},{"word":"Hz","frame":3430},{"word":"apart,","frame":3437},{"word":"just","frame":3451},{"word":"fast","frame":3455},{"word":"enough.","frame":3464}]},{"line":10,"text":"Need only a few bins? Goertzel is a filter ringing at one bin's point. For bin twenty of key five, its last two outputs give ninety-one point eight, the DFT's match, at one multiplication a sample. Under about sixteen bins, it beats the FFT.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/13-fft/4-video/vo-fix/line03.wav","at":116.49,"start":116.49,"end":128.05,"start_frame":3495,"words":[{"word":"Need","frame":3495},{"word":"only","frame":3505},{"word":"a","frame":3511},{"word":"few","frame":3515},{"word":"bins?","frame":3519},{"word":"Gortzel","frame":3535},{"word":"has","frame":3548},{"word":"a","frame":3552},{"word":"filter","frame":3554},{"word":"ringing","frame":3561},{"word":"at","frame":3568},{"word":"one","frame":3573},{"word":"bins","frame":3578},{"word":"point.","frame":3586},{"word":"For","frame":3598},{"word":"bin","frame":3603},{"word":"20","frame":3608},{"word":"of","frame":3615},{"word":"key","frame":3620},{"word":"5,","frame":3624},{"word":"its","frame":3633},{"word":"last","frame":3639},{"word":"two","frame":3645},{"word":"outputs","frame":3650},{"word":"give","frame":3660},{"word":"91","frame":3665},{"word":".8.","frame":3676},{"word":"The","frame":3694},{"word":"DFTs","frame":3697},{"word":"match","frame":3712},{"word":"at","frame":3717},{"word":"one","frame":3723},{"word":"multiplication","frame":3727},{"word":"a","frame":3743},{"word":"sample.","frame":3750},{"word":"Under","frame":37
