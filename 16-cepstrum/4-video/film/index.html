rd":"hertz","frame":888},{"word":"comes","frame":894},{"word":"out","frame":901},{"word":"one","frame":907},{"word":"and","frame":915},{"word":"a","frame":916},{"word":"half","frame":918},{"word":"times","frame":922},{"word":"as","frame":931},{"word":"tall","frame":935},{"word":"one","frame":942},{"word":"thousand","frame":951},{"word":"hertz","frame":959},{"word":"comes","frame":966},{"word":"out","frame":973},{"word":"at","frame":978},{"word":"half","frame":981},{"word":"height","frame":986},{"word":"same","frame":994},{"word":"echo","frame":1003},{"word":"louder","frame":1012},{"word":"here","frame":1023},{"word":"quieter","frame":1030}]},{"line":4,"text":"On the wheel, one thousand hertz turns forty-five degrees per sample. The echo sits four steps behind, a half lap, and pulls against the tone. At two thousand hertz it sits a full lap behind, right on top. Walk up through the tones, and the gain rises and falls. That's a ripple.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/16-cepstrum/4-video/vo/line04.wav","at":35.9,"start":35.9,"end":49.27,"start_frame":1077,"words":[{"word":"on","frame":1077},{"word":"the","frame":1086},{"word":"wheel","frame":1088},{"word":"1000","frame":1094},{"word":"hertz","frame":1111},{"word":"turns","frame":1120},{"word":"45","frame":1130},{"word":"degrees","frame":1142},{"word":"per","frame":1154},{"word":"sample","frame":1162},{"word":"the","frame":1174},{"word":"echo","frame":1183},{"word":"sits","frame":1190},{"word":"four","frame":1199},{"word":"steps","frame":1206},{"word":"behind","frame":1214},{"word":"a","frame":1227},{"word":"half","frame":1235},{"word":"lap","frame":1242},{"word":"and","frame":1249},{"word":"pulls","frame":1255},{"word":"against","frame":1262},{"word":"the","frame":1269},{"word":"tone","frame":1275},{"word":"at","frame":1283},{"word":"2000","frame":1295},{"word":"hertz","frame":1306},{"word":"it","frame":1315},{"word":"sits","frame":1321},{"word":"a","frame":1327},{"word":"full","frame":1330},{"word" g, and multiplied turns into plus. Now it swings one point one everywhere. That's the log spectrum.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/16-cepstrum/4-video/vo/line06.wav","at":59.87,"start":59.87,"end":75.17,"start_frame":1796,"words":[{"word":"you","frame":1796},{"word":"never","frame":1805},{"word":"see","frame":1812},{"word":"the","frame":1819},{"word":"echo","frame":1822},{"word":"alone","frame":1830},{"word":"though","frame":1840},{"word":"the","frame":1846},{"word":"voice","frame":1858},{"word":"is","frame":1866},{"word":"loud","frame":1870},{"word":"near","frame":1876},{"word":"700","frame":1881},{"word":"hertz","frame":1894},{"word":"quiet","frame":1905},{"word":"near","frame":1920},{"word":"3000","frame":1926},{"word":"and","frame":1939},{"word":"the","frame":1956},{"word":"echo","frame":1959},{"word":"multiplies","frame":1969},{"word":"it","frame":1982},{"word":"so","frame":1986},{"word":"the","frame":2002},{"word":"ripple","frame":2006},{"word":"swings","frame":2012},{"word":"by","frame":2021},{"word":"a","frame":2026},{"word":"hundred","frame":2030},{"word":"on","frame":2034},{"word":"the","frame":2040},{"word":"hump","frame":2042},{"word":"and","frame":2048},{"word":"by","frame":2056},{"word":"one","frame":2059},{"word":"in","frame":2065},{"word":"the","frame":2068},{"word":"valley","frame":2071},{"word":"take","frame":2079},{"word":"the","frame":2096},{"word":"log","frame":2100},{"word":"and","frame":2108},{"word":"multiplied","frame":2112},{"word":"turns","frame":2126},{"word":"into","frame":2139},{"word":"plus","frame":2145},{"word":"now","frame":2154},{"word":"it","frame":2171},{"word":"swings","frame":2175},{"word":"1","frame":2182},{"word":".1","frame":2190},{"word":"everywhere","frame":2200},{"word":"that's","frame":2213},{"word":"the","frame":2228},{"word":"log","frame":2230},{"word":"spectrum","frame":2237}]},{"line":7,"text":"Back to the tiny echo. Its log gain repeats: point four one, point one one, minus point six nine, point one one. How often? That's lesson twelve's question. Run the list through the FFT, and bin four lights up. Oh, and four is the delay.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/16-cepstrum/4-video/vo-breath/line07.wav","at":75.97,"start":75.97,"end":87.93,"start_frame":2279,"words":[{"word":"back","frame":2279},{"word":"to","frame":2289},{"word":"the","frame":2293},{"word":"tiny","frame":2296},{"word":"echo","frame":2304},{"word":"its","frame":2314},{"word":"log","frame":2337},{"word":"gain","frame":2344},{"word":"repeats","frame":2350},{"word":"point","frame":2365},{"word":"four","frame":2373},{"word":"one","frame":2380},{"word":"point","frame":2388},{"word":"one","frame":2396},{"word":"one","frame":2402},{"word":"minus","frame":2408},{"word":"point","frame":2418},{"word":"six","frame":2424},{"word":"nine","frame":2432},{"word":"point","frame":2439},{"word":"one","frame":2452},{"word":"one","frame":2452},{"word":"how","frame":2457},{"word":"often","frame":2470},{"word":"that's","frame":2491},{"word":"lesson","frame":2500},{"word":"12's","frame":2507},{"word":"question","frame":2517},{"word":"run","frame":2526},{"word":"the","frame":2535},{"word":"list","frame":2539},{"word":"through","frame":2544},{"word":"the","frame":2548},{"word":"fft","frame":2552},{"word":"and","frame":2564},{"word":"bin","frame":2574},{"word":"four","frame":2580},{"word":"lights","frame":2587},{"word":"up","frame":2594},{"word":"oh","frame":2604},{"word":"and","frame":2604},{"word":"four","frame":2608},{"word":"is","frame":2614},{"word":"the","frame":2618},{"word":"delay","frame":2621}]},{"line":8,"text":"On a circle, zero to eight thousand hertz is one lap, and the bottom half mirrors the top. Walk once round, and an echo D samples late laps the tone D times: bin D. The FFT of the log spectrum is the cepstrum. Spec, backwards. Its positions are quefrencies, measured in time.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/16-cepstrum/4-video/vo-fix/line02.wav","at":88.93,"start "frame":3675},{"word":"at","frame":3682},{"word":"twice","frame":3688},{"word":"the","frame":3694},{"word":"peak,","frame":3699},{"word":"0","frame":3710},{"word":".4,","frame":3715},{"word":"and","frame":3730},{"word":"raise","frame":3733},{"word":"it","frame":3740},{"word":"until","frame":3744},{"word":"the","frame":3750},{"word":"peak","frame":3754},{"word":"is","frame":3760},{"word":"gone.","frame":3763},{"word":"The","frame":3781},{"word":"echo","frame":3783},{"word":"told","frame":3790},{"word":"you","frame":3799},{"word":"its","frame":3802},{"word":"own","frame":3807},{"word":"address.","frame":3811}]},{"line":11,"text":"That's the last bug. One click, a wheel that never left, a row of test wheels on a keypad, and today, a spectrum of a spectrum. Next time a line echoes, you'll know where to look.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/16-cepstrum/4-video/vo-fix/line04.wav","at":128.77,"start":128.77,"end":137.22,"start_frame":3863,"words":[{"word":"That's","frame":3863},{"word":"the","frame":3874},{"word":"last","frame":3878},{"word":"bug.","frame":3885},{"word":"One","frame":3899},{"word":"click,","frame":3907},{"word":"a","frame":3918},{"word":"wheel","frame":3920},{"word":"that","frame":3926},{"word":"never","frame":3930},{"word":"left,","frame":3936},{"word":"a","frame":3948},{"word":"row","frame":3950},{"word":"of","frame":3954},{"word":"test","frame":3957},{"word":"wheels","frame":3963},{"word":"on","frame":3970},{"word":"a","frame":3975},{"word":"keypad,","frame":3978},{"word":"and","frame":3997},{"word":"today,","frame":3999},{"word":"a","frame":4012},{"word":"spectrum","frame":4014},{"word":"of","frame":4024},{"word":"a","frame":4031},{"word":"spectrum.","frame":4034},{"word":"Next","frame":4052},{"word":"time","frame":4062},{"word":"a","frame":4068},{"word":"line","frame":4073},{"word":"echoes,","frame":4078},{"word":"you'll","frame":4092},{"word":"know","frame":4094},{"word":"where","frame":4098},{"word":"to","frame":4102},{"word":"lo };
