<div class="lab" id="lab">
  <h3>Lab: an echo, tone by tone</h3>
  <div id="a1-ask"></div>
  <canvas id="a1-stage" class="stage" role="img" aria-label="The echo's gain against tone, the log of that gain, and the cepstrum."></canvas>
  <div class="key">
    <span><i class="c-k-curve"></i>now</span>
    <span id="a1-key-pin" hidden><i class="c-k-pin"></i>pinned</span>
    <span id="a1-key-peak" hidden><i class="c-k-peak"></i>the tallest spike</span>
    <span id="a1-key-sweep" hidden><i class="c-k-sweep"></i>where the sweep is now</span>
  </div>
  <div class="readout" aria-live="polite">
    <div class="result" id="a1-result"></div>
    <p id="a1-why"></p>
    <p class="compare" id="a1-compare" hidden></p>
  </div>
  <div class="controls">
    <div class="control">
      <label for="a1-delay">Delay: <output id="a1-delay-out">4 samples</output></label>
      <input id="a1-delay" type="range" min="1" max="2400" step="1" value="4" disabled>
      <div class="row">
        <button type="button" id="a1-half" disabled>Halve</button>
        <button type="button" id="a1-double" disabled>Double</button>
      </div>
    </div>
    <div class="control">
      <label for="a1-strength">Strength: <output id="a1-strength-out">0.50</output></label>
      <input id="a1-strength" type="range" min="0" max="0.9" step="0.01" value="0.5" disabled>
    </div>
  </div>
  <div class="row">
    <button type="button" id="a1-play" disabled>Play the sweep</button>
    <button type="button" id="a1-echo" class="k-toggle" aria-pressed="true" disabled>Echo on</button>
    <button type="button" id="a1-zoom" class="k-toggle" aria-pressed="false" disabled>Zoom in on four ripples</button>
    <button type="button" id="a1-pin" disabled>Pin this</button>
    <button type="button" id="a1-reset">Reset</button>
  </div>
  <p class="k-now" id="a1-now" aria-live="polite">Not playing.</p>
  <p class="jump"><a href="#your-turn">Ready for the real bug? Jump to the challenge.</a></p>
</div>
