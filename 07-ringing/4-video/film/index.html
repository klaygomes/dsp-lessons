rd":"time.","frame":1804}]},{"line":6,"text":"The decay time is how long the ring takes to shrink to one percent of where it started. Radius point nine gives five and a half milliseconds. Point nine eight gives twenty-eight and a half, five times as long. Halve the gap from pole to circle, and the decay time doubles.","clip":"/Users/cleiton.loiola/personal/lessons/dsp-oppenheim/07-ringing/4-video/vo-fix2/line02.wav","at":61.56,"start":61.56,"end":74.62,"start_frame":1847,"words":[{"word":"The","frame":1847},{"word":"decay","frame":1855},{"word":"time","frame":1862},{"word":"is","frame":1871},{"word":"how","frame":1876},{"word":"long","frame":1880},{"word":"the","frame":1886},{"word":"ring","frame":1891},{"word":"takes","frame":1895},{"word":"to","frame":1904},{"word":"shrink","frame":1910},{"word":"to","frame":1916},{"word":"1","frame":1921},{"word":"%","frame":1927},{"word":"of","frame":1934},{"word":"where","frame":1942},{"word":"it","frame":1946},{"word":"started.","frame":1950},{"word":"Radius","frame":1974},{"word":"0","frame":1981},{"word":".9","frame":1987},{"word":"gives","frame":1997},{"word":"5","frame":2004},{"word":".5","frame":2014},{"word":"milliseconds.","frame":2024},{"word":"0","frame":2051},{"word":".98","frame":2060},{"word":"gives","frame":2073},{"word":"28","frame":2083},{"word":".5,","frame":2095},{"word":"five","frame":2109},{"word":"times","frame":2118},{"word":"as","frame":2128},{"word":"long.","frame":2132},{"word":"Halve","frame":2150},{"word":"the","frame":2155},{"word":"gap","frame":2158},{"word":"from","frame":2164},{"word":"pole","frame":2169},{"word":"to","frame":2175},{"word":"circle,","frame":2179},{"word":"and","frame":2193},{"word":"the","frame":2198},{"word":"decay","frame":2201},{"word":"time","frame":2208},{"word":"doubles.","frame":2217}]},{"line":7,"text":"Closer poles make the notch narrower. The bandwidth is the width of the notch, in hertz, between the two tones on either side that it passes at seventy-one percent. Radius
