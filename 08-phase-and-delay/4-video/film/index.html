ers/cleiton.loiola/personal/lessons/dsp-oppenheim/08-phase-and-delay/4-video/vo/line08.wav","at":91.81,"start":91.81,"end":105.81,"start_frame":2754,"words":[{"word":"that's","frame":2754},{"word":"a","frame":2765},{"word":"difference","frame":2767},{"word":"in","frame":2774},{"word":"phase","frame":2781},{"word":"over","frame":2790},{"word":"a","frame":2798},{"word":"difference","frame":2802},{"word":"in","frame":2810},{"word":"turn","frame":2816},{"word":"slide","frame":2823},{"word":"the","frame":2843},{"word":"two","frame":2847},{"word":"tones","frame":2852},{"word":"together","frame":2859},{"word":"and","frame":2868},{"word":"it","frame":2876},{"word":"becomes","frame":2880},{"word":"how","frame":2887},{"word":"steeply","frame":2893},{"word":"the","frame":2906},{"word":"phase","frame":2910},{"word":"climbs","frame":2918},{"word":"that's","frame":2930},{"word":"the","frame":2944},{"word":"group","frame":2947},{"word":"delay","frame":2952},{"word":"0","frame":2962},{"word":".31","frame":2976},{"word":"samples","frame":2987},{"word":"near","frame":3003},{"word":"1000","frame":3010},{"word":"hertz","frame":3026},{"word":"3","frame":3046},{"word":".24","frame":3050},{"word":"near","frame":3068},{"word":"1800","frame":3076},{"word":"three","frame":3090},{"word":"apart","frame":3110},{"word":"the","frame":3121},{"word":"fax","frame":3131},{"word":"allows","frame":3140},{"word":"one","frame":3148},{"word":"and","frame":3156},{"word":"a","frame":3159},{"word":"half","frame":3162}]},{"line":9,"text":"So add a filter that only delays. A pole inside the circle, radius point six five, at twelve hundred hertz. A zero on the same line, outside, at one over point six five. From any tone, the zero is always one point five four times as far as the pole. That ratio never changes, so compared with zero hertz, every tone passes a hundred percent. That's an all-pass.","clip":"/Users/cleiton.loiola/personal/lessons/dsp-oppenheim/08-phase-and-delay/4-video/vo-fix4/line01.wav","at":106.61,"start":106.61,"end":123.82,"start_frame":3198,"words":[{"word":"so","frame":3198},{"word":"add","frame":3207},{"word":"a","frame":3213},{"word":"filter","frame":3215},{"word":"that","frame":3222},{"word":"only","frame":3228},{"word":"delays","frame":3235},{"word":"a","frame":3248},{"word":"pole","frame":3258},{"word":"inside","frame":3265},{"word":"the","frame":3273},{"word":"circle","frame":3278},{"word":"radius","frame":3287},{"word":"0","frame":3298},{"word":".65","frame":3306},{"word":"at","frame":3319},{"word":"1200","frame":3328},{"word":"hertz","frame":3336},{"word":"a","frame":3350},{"word":"zero","frame":3362},{"word":"on","frame":3368},{"word":"the","frame":3374},{"word":"same","frame":3376},{"word":"line","frame":3381},{"word":"outside","frame":3390},{"word":"at","frame":3402},{"word":"one","frame":3413},{"word":"over","frame":3418},{"word":"0","frame":3423},{"word":".65","frame":3429},{"word":"from","frame":3442},{"word":"any","frame":3456},{"word":"tone","frame":3462},{"word":"the","frame":3469},{"word":"zero","frame":3474},{"word":"is","frame":3480},{"word":"always","frame":3484},{"word":"1","frame":3490},{"word":".5","frame":3498},{"word":"four","frame":3513},{"word":"times","frame":3520},{"word":"as","frame":3529},{"word":"far","frame":3536},{"word":"as","frame":3540},{"word":"the","frame":3544},{"word":"pole","frame":3547},{"word":"that","frame":3555},{"word":"ratio","frame":3567},{"word":"never","frame":3576},{"word":"changes","frame":3584},{"word":"so","frame":3594},{"word":"compared","frame":3603},{"word":"with","frame":3613},{"word":"zero","frame":3618},{"word":"hertz","frame":3626},{"word":"every","frame":3635},{"word":"tone","frame":3645},{"word":"passes","frame":3651},{"word":"a","frame":3662},{"word":"hundred","frame":3667},{"word":"percent","frame":3670},{"word":"that's","frame":3688},{"word":"an","frame":3694},{"word":"all","frame":3696},{"word":"pass","frame":3700}]},{"line":10,"text":"It holds back the tones near its pole the most.   const three = f => gainOf([[0.99, 0, 0.99], [1, 0, 0.9604]], f * 2000 / 1900) * gainOf([[0.99, 0, 0.99], [1, 0, 0.9604]], f) * gainOf([[0.99, 0, 0.99], [1, 0, 0.9604]], f * 2000 / 2100);
  const tc = layer(b, curve(range(1500, 2500, 1).map(f => [GX(f), GY(Math.min(1.05, three(f)))]), C.ink, 5), [GX(1500) - 8, GX(2500) + 8]);
  reveal(tc, nx + 6, mu + 10, 'cruise');
  M.show(label(b, 'three notches,', 1290, 140, 'lbl'), nx + 6);
  M.show(label(b, 'one rule', 1290, 214, 'lbl'), mu);
  M.show(label(b, 'laptop: perfect', 1290, 310, 'lbl ok'), pe);
  M.show(tick(b, 1790, 350), pe + 6);
  const hy = 740, hum = range(0, 1600, 1).map(x => [200 + x, hy - 110 * Math.min(1, 0.02 * Math.exp(x / 400)) * Math.sin(x / 9)]);
  const hl = layer(b, curve(hum, C.accent, 6), [190, 1810]);
  reveal(hl, ch, END - 30, 'cruise');
  flicker(hl, 1000, hy, ch, END - 28, 0.6, 7);
  M.show(label(b, 'on the chip: it hums', 200, 540, 'lbl acc'), ch);
  M.show(label(b, 'louder and louder', 1290, 530, 'lbl acc'), word(11, 'louder', 1));
}
SCENES.forEach((id, i) => { if (i === 0) return; M.cut(sceneStart(i + 1), { hide: [`#${SCENES[i - 1]}`], show: [`#${id}`] }); M.hide(`#${id}`, 0); });
window.__misses = MISSES;
if (MISSES.length) console.error('word anchors missing: ' + MISSES.join(' '));
window.__ready = Motion.loaded().then(() => { if (/selftest/.test(location.search)) Motion.selfTest(M, { samples: 24 }); });
</script>
