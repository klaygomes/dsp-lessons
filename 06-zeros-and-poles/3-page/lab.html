<template id="filter-lab">
  <div class="task" data-k="task" hidden><p data-k="task-text"></p></div>
  <div data-k="ask"></div>
  <canvas data-k="stage" class="stage" role="img"></canvas>
  <div class="key" data-k="key-explore">
    <span><i class="k-fresh"></i>the tone’s fresh dot (you move it)</span>
    <span><i class="k-old"></i>the dot one sample before</span>
    <span data-k="key-mid"><i class="k-mid"></i>their midpoint: the average</span>
    <span data-k="key-pin" hidden><i class="k-pin"></i>pinned tone</span>
  </div>
  <div class="key" data-k="key-fix" hidden>
    <span><i class="k-zero"></i>zero pair (you move it)</span>
    <span data-k="key-pole"><i class="k-pole"></i>pole pair</span>
    <span><i class="k-curve"></i>how much each tone passes, compared with 0 Hz</span>
    <span data-k="key-spike" hidden><i class="k-spike"></i>the whine, on the frequency meter</span>
    <span><i class="k-band"></i>voice tones, 300 to 3,400 Hz</span>
  </div>
  <div class="meters">
    <div class="k-meter" data-k="meter-a">
      <span data-k="meter-a-label">Passes</span>
      <div class="bar" aria-hidden="true"><div class="fill"></div></div>
      <output aria-live="polite">?</output>
      <div class="scale" aria-hidden="true"><span>0%</span><span>100%</span></div>
    </div>
    <div class="k-meter" data-k="meter-b" hidden>
      <span>Voice: average share of its tones (done above 90%)</span>
      <div class="bar" aria-hidden="true"><div class="fill"></div></div>
      <output aria-live="polite">?</output>
      <div class="scale" aria-hidden="true"><span>0%</span><span>100%</span></div>
    </div>
  </div>
  <div class="readout" aria-live="polite">
    <div class="result" data-k="result"></div>
    <p data-k="why"></p>
    <p class="compare" data-k="compare" hidden></p>
  </div>
  <div class="control" data-k="tone-control">
    <label data-for="tone">Tone: <output data-k="tone-out">2,000 Hz</output></label>
    <input data-k="tone" type="range" min="0" max="4000" step="50" value="2000" disabled>
  </div>
  <div class="control" data-k="zero-control" hidden>
    <label data-for="zero">Zero pair at: <output data-k="zero-out">1,000 Hz</output></label>
    <input data-k="zero" type="range" min="0" max="4000" step="10" value="1000" disabled>
    <div class="typed">
      <label data-for="zero-typed">or type it, in Hz:</label>
      <input data-k="zero-typed" type="text" inputmode="numeric" autocomplete="off" value="1000" disabled>
      <span data-k="zero-msg" aria-live="polite"></span>
    </div>
  </div>
  <div data-k="ask-poles" hidden></div>
  <div class="control" data-k="pole-control" hidden>
    <label data-for="pole">Pole radius: <output data-k="pole-out">0 (no poles)</output></label>
    <input data-k="pole" type="range" min="0" max="1.1" step="0.01" value="0" disabled>
  </div>
  <div class="row">
    <button type="button" data-k="play">Play the call</button>
    <button type="button" data-k="filter" class="k-toggle" aria-pressed="true">Filter on</button>
    <button type="button" data-k="pin" disabled>Pin this tone</button>
    <button type="button" data-k="another" hidden>Try another whine</button>
    <button type="button" data-k="reset">Reset</button>
  </div>
  <p class="k-now" data-k="now" aria-live="polite"></p>
  <p class="jump" data-k="jump"><a href="#your-turn">Ready for the real bug? Jump to the challenge.</a></p>
</template>
<div class="lab" id="lab"></div>
