const SCHEDULE = {"fps":30,"duration":138.76,"wpm":201,"lines":[{"line":1,"text":"The line went live last week. Quiet callers are fine. Loud callers hear a harsh, raspy buzz. One says his boss sounds like he's yelling through a kazoo. [laughter]","clip":"/Users/cleiton.loiola/personal/dsp-lessons/01-signals-and-systems/4-video/vo-r3/line01.wav","at":0.6,"start":0.6,"end":8.51,"start_frame":18,"words":[{"word":"The","frame":18},{"word":"line","frame":26},{"word":"went","frame":32},{"word":"live","frame":38},{"word":"last","frame":45},{"word":"week.","frame":52},{"word":"Quiet","frame":61},{"word":"callers","frame":68},{"word":"are","frame":79},{"word":"fine.","frame":83},{"word":"Loud","frame":99},{"word":"callers","frame":106},{"word":"hear","frame":119},{"word":"a","frame":124},{"word":"harsh,","frame":127},{"word":"raspy","frame":142},{"word":"buzz.","frame":152},{"word":"One","frame":172},{"word":"says","frame":176},{"word":"his","frame":181},{"word":"boss","frame":187},{"word":"sounds","frame":194},{"word":"like","frame":200},{"word":"he's","frame":205},{"word":"yelling","frame":211},{"word":"through","frame":217},{"word":"a","frame":224},{"word":"kazoo.","frame":227}]},{"line":2,"text":"Strange, isn't it? Same code for everybody, and louder should just be louder. The line carries the microphone's voltage, measured eight thousand times a second. Each is a sample; the list is a signal.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/01-signals-and-systems/4-video/vo-r4/line01.wav","at":9.31,"start":9.31,"end":19.07,"start_frame":279,"words":[{"word":"Strange,","frame":279},{"word":"isn't","frame":300},{"word":"it?","frame":303},{"word":"Same","frame":314},{"word":"code","frame":319},{"word":"for","frame":326},{"word":"everybody,","frame":330},{"word":"and","frame":348},{"word":"louder","frame":354},{"word":"should","frame":361},{"word":"just","frame":366},{"word":"be","frame":372},{"word":"louder.","frame":376},{"word":"The","frame":395},{"word":"line","frame":398},{"word":"carries","frame":405},{"word":"the","frame":414},{"word":"microphone's","frame":418},{"word":"voltage,","frame":434},{"word":"measured","frame":451},{"word":"8","frame":462},{"word":",000","frame":468},{"word":"times","frame":478},{"word":"a","frame":484},{"word":"second.","frame":489},{"word":"Each","frame":506},{"word":"is","frame":510},{"word":"a","frame":513},{"word":"sample.","frame":517},{"word":"The","frame":536},{"word":"list","frame":539},{"word":"is","frame":545},{"word":"a","frame":550},{"word":"signal.","frame":554}]},{"line":3,"text":"The simplest sound is a tone. How often it repeats, in hertz, is its pitch. Its samples are the cosine of an angle that turns a fixed step: at one thousand hertz, forty-five degrees. Eight samples make a full turn.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/01-signals-and-systems/4-video/vo-r3/line03.wav","at":19.57,"start":19.57,"end":29.84,"start_frame":587,"words":[{"word":"The","frame":587},{"word":"simplest","frame":595},{"word":"sound","frame":603},{"word":"is","frame":612},{"word":"a","frame":616},{"word":"tone.","frame":620},{"word":"How","frame":633},{"word":"often","frame":642},{"word":"it","frame":650},{"word":"repeats","frame":653},{"word":"in","frame":663},{"word":"hertz","frame":669},{"word":"is","frame":676},{"word":"its","frame":682},{"word":"pitch.","frame":686},{"word":"Its","frame":708},{"word":"samples","frame":711},{"word":"are","frame":720},{"word":"the","frame":725},{"word":"cosine","frame":728},{"word":"of","frame":738},{"word":"an","frame":745},{"word":"angle","frame":748},{"word":"that","frame":755},{"word":"turns","frame":760},{"word":"a","frame":766},{"word":"fixed","frame":770},{"word":"step","frame":777},{"word":"at","frame":794},{"word":"1000","frame":799},{"word":"hertz","frame":810},{"word":"45","frame":818},{"word":"degrees.","frame":828},{"word":"Eight","frame":849},{"word":"samples","frame":854},{"word":"make","frame":865},{"word":"a","frame":872},{"word":"full","frame":874},{"word":"turn.","frame":880}]},{"line":4,"text":"The booster is a system: one signal in, another out. Its rule: multiply every sample by four. But the chip after it only stores the range, minus one to plus one. Hand it two, past the edge, and it writes one. That's clipping.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/01-signals-and-systems/4-video/vo-r4/line02.wav","at":30.44,"start":30.44,"end":41.12,"start_frame":913,"words":[{"word":"the","frame":913},{"word":"booster","frame":922},{"word":"is","frame":929},{"word":"a","frame":935},{"word":"system","frame":939},{"word":"one","frame":947},{"word":"signal","frame":959},{"word":"in","frame":968},{"word":"another","frame":973},{"word":"out","frame":980},{"word":"its","frame":989},{"word":"rule","frame":997},{"word":"multiply","frame":1004},{"word":"every","frame":1019},{"word":"sample","frame":1029},{"word":"by","frame":1037},{"word":"four","frame":1043},{"word":"but","frame":1053},{"word":"the","frame":1064},{"word":"chip","frame":1066},{"word":"after","frame":1072},{"word":"it","frame":1080},{"word":"only","frame":1084},{"word":"stores","frame":1088},{"word":"the","frame":1096},{"word":"range","frame":1101},{"word":"minus","frame":1110},{"word":"one","frame":1120},{"word":"to","frame":1126},{"word":"plus","frame":1129},{"word":"one","frame":1136},{"word":"hand","frame":1143},{"word":"it","frame":1153},{"word":"two","frame":1157},{"word":"past","frame":1163},{"word":"the","frame":1172},{"word":"edge","frame":1177},{"word":"and","frame":1183},{"word":"it","frame":1190},{"word":"writes","frame":1191},{"word":"one","frame":1198},{"word":"that's","frame":1205},{"word":"clipping","frame":1217}]},{"line":5,"text":"A quiet caller is size point two, their biggest sample; a loud one, point five. Which comes out clean? The quiet one grows to point eight. The loud one would reach two: its tops get sliced flat.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/01-signals-and-systems/4-video/vo-r4/line03.wav","at":42.92,"start":42.92,"end":51.99,"start_frame":1288,"words":[{"word":"A","frame":1288},{"word":"quiet","frame":1296},{"word":"collar","frame":1304},{"word":"is","frame":1313},{"word":"size","frame":1319},{"word":".2,","frame":1327},{"word":"their","frame":1344},{"word":"biggest","frame":1347},{"word":"sample,","frame":1354},{"word":"a","frame":1368},{"word":"loud","frame":1372},{"word":"one","frame":1376},{"word":".5,","frame":1382},{"word":"which","frame":1402},{"word":"comes","frame":1409},{"word":"out","frame":1416},{"word":"clean.","frame":1421},{"word":"The","frame":1436},{"word":"quiet","frame":1438},{"word":"one","frame":1446},{"word":"grows","frame":1451},{"word":"to","frame":1460},{"word":".8,","frame":1466},{"word":"the","frame":1484},{"word":"loud","frame":1489},{"word":"one","frame":1494},{"word":"would","frame":1499},{"word":"reach","frame":1503},{"word":"2,","frame":1510},{"word":"its","frame":1519},{"word":"tops","frame":1523},{"word":"get","frame":1531},{"word":"sliced","frame":1536},{"word":"flat.","frame":1544}]},{"line":6,"text":"Is that just an uglier tone? Try the neighbor rule: in this tone, any two neighbors add up to one point four one four times the sample between them. The clean tone passes. The clipped one fails.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/01-signals-and-systems/4-video/vo-r4/line04.wav","at":52.99,"start":52.99,"end":62.31,"start_frame":1590,"words":[{"word":"Is","frame":1590},{"word":"that","frame":1599},{"word":"just","frame":1602},{"word":"an","frame":1606},{"word":"uglier","frame":1611},{"word":"tone?","frame":1622},{"word":"Try","frame":1636},{"word":"the","frame":1641},{"word":"neighbor","frame":1644},{"word":"rule.","frame":1651},{"word":"In","frame":1664},{"word":"this","frame":1670},{"word":"tone,","frame":1674},{"word":"any","frame":1688},{"word":"two","frame":1690},{"word":"neighbors","frame":1695},{"word":"add","frame":1704},{"word":"up","frame":1712},{"word":"to","frame":1715},{"word":"1","frame":1719},{"word":".414","frame":1725},{"word":"times","frame":1747},{"word":"the","frame":1758},{"word":"sample","frame":1761},{"word":"between","frame":1769},{"word":"them.","frame":1779},{"word":"The","frame":1799},{"word":"clean","frame":1802},{"word":"tone","frame":1808},{"word":"passes.","frame":1814},{"word":"The","frame":1833},{"word":"clipped","frame":1836},{"word":"one","frame":1843},{"word":"fails.","frame":1848}]},{"line":7,"text":"So what is it? [surprise-oh] It's two tones: a one thousand hertz tone, minus a three thousand hertz tone about a sixth its size. That second tone is the buzz. The booster made it, out of nothing.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/01-signals-and-systems/4-video/vo-r3/line07.wav","at":64.31,"start":64.31,"end":73.67,"start_frame":1929,"words":[{"word":"So","frame":1929},{"word":"what","frame":1937},{"word":"is","frame":1941},{"word":"it?","frame":1945},{"word":"Oh,","frame":1948},{"word":"it's","frame":1954},{"word":"two","frame":1957},{"word":"tones.","frame":1962},{"word":"A","frame":1978},{"word":"1000","frame":1984},{"word":"Hz","frame":2000},{"word":"tone","frame":2009},{"word":"minus","frame":2020},{"word":"a","frame":2030},{"word":"3000","frame":2036},{"word":"Hz","frame":2046},{"word":"tone,","frame":2060},{"word":"about","frame":2069},{"word":"a","frame":2076},{"word":"sixth","frame":2079},{"word":"its","frame":2088},{"word":"size.","frame":2094},{"word":"That","frame":2112},{"word":"second","frame":2116},{"word":"tone","frame":2124},{"word":"is","frame":2133},{"word":"the","frame":2140},{"word":"buzz.","frame":2144},{"word":"The","frame":2157},{"word":"booster","frame":2160},{"word":"made","frame":2169},{"word":"it","frame":2178},{"word":"out","frame":2182},{"word":"of","frame":2190},{"word":"nothing.","frame":2193}]},{"line":8,"text":"What did the booster break? A system is linear when doubling the input doubles the output, and inputs added give outputs added. The real booster is not linear. It only behaves like the linear times four while its outputs stay inside the range.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/01-signals-and-systems/4-video/vo-r4/line05.wav","at":74.67,"start":74.67,"end":86.58,"start_frame":2240,"words":[{"word":"What","frame":2240},{"word":"did","frame":2249},{"word":"the","frame":2253},{"word":"booster","frame":2255},{"word":"break?","frame":2264},{"word":"A","frame":2283},{"word":"system","frame":2286},{"word":"is","frame":2295},{"word":"linear","frame":2300},{"word":"when","frame":2309},{"word":"doubling","frame":2316},{"word":"the","frame":2325},{"word":"input","frame":2331},{"word":"doubles","frame":2340},{"word":"the","frame":2350},{"word":"output,","frame":2355},{"word":"and","frame":2372},{"word":"inputs","frame":2374},{"word":"added","frame":2385},{"word":"give","frame":2393},{"word":"outputs","frame":2400},{"word":"added.","frame":2412},{"word":"The","frame":2432},{"word":"real","frame":2436},{"word":"booster","frame":2442},{"word":"is","frame":2452},{"word":"not","frame":2458},{"word":"linear,","frame":2463},{"word":"it","frame":2478},{"word":"only","frame":2482},{"word":"behaves","frame":2487},{"word":"like","frame":2499},{"word":"the","frame":2504},{"word":"linear","frame":2508},{"word":"times","frame":2517},{"word":"4","frame":2525},{"word":"while","frame":2535},{"word":"its","frame":2542},{"word":"outputs","frame":2547},{"word":"stay","frame":2557},{"word":"inside","frame":2565},{"word":"the","frame":2573},{"word":"range.","frame":2578}]},{"line":9,"text":"Here's the trap. Two quiet voices share a speakerphone. Each alone peaks at point eight. Together, linearity says one point six; the chip writes one, and the pair buzzes. Linearity is a promise about sums.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/01-signals-and-systems/4-video/vo-r4/line06.wav","at":87.18,"start":87.18,"end":97.16,"start_frame":2615,"words":[{"word":"here's","frame":2615},{"word":"the","frame":2626},{"word":"trap","frame":2629},{"word":"two","frame":2636},{"word":"quiet","frame":2645},{"word":"voices","frame":2654},{"word":"share","frame":2663},{"word":"a","frame":2672},{"word":"speakerphone","frame":2675},{"word":"each","frame":2691},{"word":"alone","frame":2701},{"word":"peaks","frame":2708},{"word":"at","frame":2717},{"word":"0","frame":2723},{"word":".8","frame":2728},{"word":"together","frame":2749},{"word":"linearity","frame":2758},{"word":"says","frame":2776},{"word":"1","frame":2783},{"word":".6","frame":2789},{"word":"the","frame":2804},{"word":"chip","frame":2812},{"word":"writes","frame":2818},{"word":"one","frame":2826},{"word":"and","frame":2833},{"word":"the","frame":2837},{"word":"pair","frame":2840},{"word":"buzzes","frame":2845},{"word":"linearity","frame":2858},{"word":"is","frame":2875},{"word":"a","frame":2879},{"word":"promise","frame":2881},{"word":"about","frame":2890},{"word":"sums","frame":2897}]},{"line":10,"text":"Time-invariant means delaying the input only delays the output. The smoother, averaging each sample with the one before, has both. Any system with both properties keeps a tone's pitch: it can only resize and shift it. No new tones, ever.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/01-signals-and-systems/4-video/vo-r4/line07.wav","at":97.96,"start":97.96,"end":109.5,"start_frame":2939,"words":[{"word":"time","frame":2939},{"word":"invariant","frame":2950},{"word":"means","frame":2963},{"word":"delaying","frame":2969},{"word":"the","frame":2980},{"word":"input","frame":2983},{"word":"only","frame":2990},{"word":"delays","frame":2998},{"word":"the","frame":3008},{"word":"output","frame":3013},{"word":"the","frame":3023},{"word":"smoother","frame":3037},{"word":"averaging","frame":3046},{"word":"each","frame":3059},{"word":"sample","frame":3069},{"word":"with","frame":3076},{"word":"the","frame":3080},{"word":"one","frame":3083},{"word":"before","frame":3087},{"word":"has","frame":3094},{"word":"both","frame":3103},{"word":"any","frame":3112},{"word":"system","frame":3128},{"word":"with","frame":3137},{"word":"both","frame":3143},{"word":"properties","frame":3148},{"word":"keeps","frame":3161},{"word":"a","frame":3169},{"word":"tone's","frame":3173},{"word":"pitch","frame":3181},{"word":"it","frame":3197},{"word":"can","frame":3199},{"word":"only","frame":3202},{"word":"resize","frame":3208},{"word":"and","frame":3220},{"word":"shift","frame":3228},{"word":"it","frame":3235},{"word":"no","frame":3241},{"word":"new","frame":3253},{"word":"tones","frame":3258},{"word":"ever","frame":3267}]},{"line":11,"text":"The fix: keep every output inside the range. The loudest input, speakerphones included, is point five. Times two lands right on the edge. Instead, keep the loudest peak at point eight, a fifth below the edge: that's headroom. So: times one point six. The buzz meter, counting new tones, reads zero.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/01-signals-and-systems/4-video/vo-r4/line11-joined.wav","at":111.5,"start":111.5,"end":126.94,"start_frame":3345,"words":[{"word":"The","frame":3345},{"word":"fix?","frame":3353},{"word":"Keep","frame":3367},{"word":"every","frame":3374},{"word":"output","frame":3382},{"word":"inside","frame":3392},{"word":"the","frame":3400},{"word":"range.","frame":3406},{"word":"The","frame":3421},{"word":"loudest","frame":3423},{"word":"input","frame":3434},{"word":"speakerphone's","frame":3443},{"word":"included","frame":3464},{"word":"is","frame":3475},{"word":"0","frame":3482},{"word":".5","frame":3487},{"word":"times","frame":3497},{"word":"2","frame":3504},{"word":"LANs","frame":3511},{"word":"right","frame":3519},{"word":"on","frame":3524},{"word":"the","frame":3528},{"word":"edge.","frame":3531},{"word":"Instead,","frame":3547},{"word":"keep","frame":3556},{"word":"the","frame":3560},{"word":"loudest","frame":3564},{"word":"peak","frame":3575},{"word":"at","frame":3580},{"word":"0","frame":3586},{"word":".8,","frame":3590},{"word":"a","frame":3603},{"word":"fifth","frame":3610},{"word":"below","frame":3614},{"word":"the","frame":3622},{"word":"edge.","frame":3627},{"word":"That's","frame":3640},{"word":"headroom,","frame":3647},{"word":"so","frame":3663},{"word":"times","frame":3670},{"word":"1","frame":3677},{"word":".6.","frame":3684},{"word":"The","frame":3736},{"word":"buzz","frame":3744},{"word":"meter","frame":3751},{"word":"counting","frame":3758},{"word":"new","frame":3768},{"word":"tones","frame":3774},{"word":"reads","frame":3782},{"word":"zero.","frame":3790}]},{"line":12,"text":"Loud callers sound like loud people again; quiet ones peak at point three two, quieter but clean. Then a new ticket: I can hear myself. Every word comes back, faint, a quarter second later. That's the next bug.","clip":"/Users/cleiton.loiola/personal/dsp-lessons/01-signals-and-systems/4-video/vo-r3/line12.wav","at":128.14,"start":128.14,"end":138.26,"start_frame":3844,"words":[{"word":"Loud","frame":3844},{"word":"callers","frame":3856},{"word":"sound","frame":3868},{"word":"like","frame":3873},{"word":"loud","frame":3878},{"word":"people","frame":3884},{"word":"again.","frame":3893},{"word":"Quiet","frame":3912},{"word":"ones","frame":3916},{"word":"peak","frame":3923},{"word":"at","frame":3931},{"word":".32,","frame":3936},{"word":"quieter","frame":3962},{"word":"but","frame":3971},{"word":"clean.","frame":3976},{"word":"Then","frame":3994},{"word":"a","frame":3997},{"word":"new","frame":4000},{"word":"ticket.","frame":4004},{"word":"I","frame":4013},{"word":"can","frame":4019},{"word":"hear","frame":4023},{"word":"myself.","frame":4027},{"word":"Every","frame":4046},{"word":"word","frame":4051},{"word":"comes","frame":4057},{"word":"back,","frame":4064},{"word":"faint,","frame":4076},{"word":"a","frame":4089},{"word":"quarter","frame":4092},{"word":"second","frame":4098},{"word":"later.","frame":4106},{"word":"That's","frame":4121},{"word":"the","frame":4125},{"word":"next","frame":4128},{"word":"bug.","frame":4133}]}]};

const SPOKEN = { one: ['one', '1'], two: ['two', '2'], four: ['four', '4'], five: ['five', '5'], six: ['six', '6'], eight: ['eight', '8'], zero: ['zero', '0'], three: ['three', '3'], thousand: ['thousand', '1,000', '1000', '3,000', '3000', '8,000', '8000'], point: ['point', '0.', '.', '1.'], percent: ['percent', '0%', '%'] };
