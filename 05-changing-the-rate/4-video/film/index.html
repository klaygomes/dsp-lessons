const SCHEDULE = {"fps":30,"duration":139.85,"wpm":207,"lines":[{"line":1,"text":"Your line now joins a wideband line, sixteen thousand samples a second, and you build the bridge. Then the tickets arrive. A second voice under every voice, thin and high. One customer says it goes down when her mother's voice goes up.","clip":"/Users/cleiton.loiola/personal/lessons/dsp-oppenheim/05-changing-the-rate/4-video/vo-fix/line01.wav","at":0.6,"start":0.6,"end":11.99,"start_frame":18,"words":[{"word":"Your","frame":18},{"word":"line","frame":28},{"word":"now","frame":35},{"word":"joins","frame":41},{"word":"a","frame":50},{"word":"wideband","frame":55},{"word":"line,","frame":68},{"word":"16","frame":82},{"word":",000","frame":91},{"word":"samples","frame":105},{"word":"a","frame":115},{"word":"second,","frame":119},{"word":"and","frame":128},{"word":"you","frame":133},{"word":"build","frame":136},{"word":"the","frame":142},{"word":"bridge.","frame":145},{"word":"Then","frame":167},{"word":"the","frame":172},{"word":"tickets","frame":175},{"word":"arrive.","frame":182},{"word":"A","frame":206},{"word":"second","frame":208},{"word":"voice,","frame":217},{"word":"under","frame":229},{"word":"every","frame":235},{"word":"voice,","frame":244},{"word":"thin","frame":254},{"word":"and","frame":259},{"word":"high,","frame":263},{"word":"one","frame":274},{"word":"customer","frame":278},{"word":"says","frame":289},{"word":"it","frame":298},{"word":"goes","frame":302},{"word":"down","frame":307},{"word":"when","frame":314},{"word":"her","frame":319},{"word":"mother's","frame":323},{"word":"voice","frame":332},{"word":"goes","frame":338},{"word":"up.","frame":346}]},{"line":2,"text":"You test it. A colleague hums one thousand hertz into a frequency meter on the wideband side. The hum arrives at half height. And a second tone, just as strong, at seven thousand. Slide the hum down to five hundred, and the ghost slides up, to seven thousand five hundred.","clip":"/Users/cleiton.loiola/personal/lessons/dsp-oppenheim/05-changing-the-rate/4-video/vo/line02.wav","at":12.59,"start":12.59,"end":25.65,"start_frame":378,"words":[{"word":"You","frame":378},{"word":"test","frame":387},{"word":"it.","frame":394},{"word":"A","frame":402},{"word":"colleague","frame":406},{"word":"hums","frame":416},{"word":"1000","frame":426},{"word":"Hz","frame":440},{"word":"into","frame":450},{"word":"a","frame":462},{"word":"frequency","frame":467},{"word":"meter","frame":478},{"word":"on","frame":488},{"word":"the","frame":492},{"word":"wideband","frame":495},{"word":"side.","frame":507},{"word":"The","frame":526},{"word":"hum","frame":528},{"word":"arrives","frame":532},{"word":"at","frame":543},{"word":"half","frame":547},{"word":"height","frame":554},{"word":"and","frame":561},{"word":"a","frame":568},{"word":"second","frame":571},{"word":"tone","frame":579},{"word":"just","frame":588},{"word":"as","frame":597},{"word":"strong","frame":603},{"word":"at","frame":611},{"word":"7000.","frame":616},{"word":"Slide","frame":646},{"word":"the","frame":652},{"word":"hum","frame":655},{"word":"down","frame":659},{"word":"to","frame":666},{"word":"500","frame":671},{"word":"and","frame":685},{"word":"the","frame":698},{"word":"ghost","frame":702},{"word":"slides","frame":708},{"word":"up","frame":718},{"word":"to","frame":725},{"word":"7500.","frame":729}]},{"line":3,"text":"Your line can't even store seven thousand. Where does it come from? Look at the bridge. It passes each sample through and puts a zero between every two, so eight thousand samples a second become sixteen thousand. That's upsampling by two. The zeros look like silence.","clip":"/Users/cleiton.loiola/personal/lessons/dsp-oppenheim/05-changing-the-rate/4-video/vo-fix/line02.wav","at":26.45,"start":26.45,"end":39.44,"start_frame":794,"words":[{"word":"Your","frame":794},{"word":"line","frame":803},{"word":"can't","frame":809},{"word":"even","frame":816},{"word":"store","frame":820},{"word":"7","frame":828},{"word":",000.","frame":836},{"word":"Where","frame":853},{"word":"does","frame":861},{"word":"it","frame":864},{"word":"come","frame":867},{"word":"from?","frame":873},{"word":"Look","frame":886},{"word":"at","frame":894},{"word":"the","frame":897},{"word":"bridge.","frame":900},{"word":"It","frame":914},{"word":"passes","frame":919},{"word":"each","frame":928},{"word":"sample","frame":939},{"word":"through","frame":947},{"word":"and","frame":953},{"word":"puts","frame":959},{"word":"a","frame":965},{"word":"zero","frame":969},{"word":"between","frame":975},{"word":"every","frame":984},{"word":"two,","frame":995},{"word":"so","frame":1009},{"word":"8","frame":1016},{"word":",000","frame":1021},{"word":"samples","frame":1032},{"word":"a","frame":1042},{"word":"second","frame":1047},{"word":"becomes","frame":1055},{"word":"16","frame":1067},{"word":",000.","frame":1077},{"word":"That's","frame":1097},{"word":"upsampling","frame":1102},{"word":"by","frame":1118},{"word":"two.","frame":1125},{"word":"The","frame":1137},{"word":"zeros","frame":1142},{"word":"look","frame":1150},{"word":"like","frame":1157},{"word":"silence.","frame":1162}]},{"line":4,"text":"Lesson three's wheel. A tone is a turning dot, and a sample is its left-right shadow. Twice the samples, half the turn. One thousand hertz turns twenty-two and a half degrees. Seven thousand turns one hundred fifty-seven and a half, under half a turn, so here it's a real tone.","clip":"/Users/cleiton.loiola/personal/lessons/dsp-oppenheim/05-changing-the-rate/4-video/vo-fix3/line01.wav","at":40.04,"start":40.04,"end":53.33,"start_frame":1201,"words":[{"word":"Lesson","frame":1201},{"word":"3's","frame":1216},{"word":"Wheel","frame":1226},{"word":"A","frame":1241},{"word":"tone","frame":1246},{"word":"is","frame":1253},{"word":"a","frame":1257},{"word":"turning","frame":1260},{"word":"dot","frame":1267},{"word":"and","frame":1276},{"word":"a","frame":1283},{"word":"sample","frame":1285},{"word":"is","frame":1294},{"word":"its","frame":1300},{"word":"left","frame":1304},{"word":"-right","frame":1310},{"word":"shadow.","frame":1315},{"word":"Twice","frame":1338},{"word":"the","frame":1343},{"word":"samples,","frame":1348},{"word":"half","frame":1363},{"word":"the","frame":1368},{"word":"turn.","frame":1372},{"word":"1000","frame":1388},{"word":"Hz","frame":1398},{"word":"turns","frame":1409},{"word":"22","frame":1420},{"word":".5","frame":1434},{"word":"degrees.","frame":1446},{"word":"7000","frame":1469},{"word":"turns","frame":1481},{"word":"157","frame":1491},{"word":".5","frame":1519},{"word":"under","frame":1531},{"word":"half","frame":1540},{"word":"a","frame":1546},{"word":"turn,","frame":1551},{"word":"so","frame":1558},{"word":"here","frame":1564},{"word":"it's","frame":1570},{"word":"a","frame":1576},{"word":"real","frame":1578},{"word":"tone.","frame":1583}]},{"line":5,"text":"Push the hum through the bridge. Even samples sit on the true tone. Odd samples are zero. Now add half of one thousand hertz to half of seven thousand. On even samples the halves agree and add up. On odd samples they're opposite, and cancel to zero. Exactly the bridge output.","clip":"/Users/cleiton.loiola/personal/lessons/dsp-oppenheim/05-changing-the-rate/4-video/vo/line05.wav","at":53.93,"start":53.93,"end":67.22,"start_frame":1618,"words":[{"word":"Push","frame":1618},{"word":"the","frame":1629},{"word":"hum","frame":1634},{"word":"through","frame":1638},{"word":"the","frame":1644},{"word":"bridge.","frame":1647},{"word":"Even","frame":1662},{"word":"samples","frame":1668},{"word":"sit","frame":1680},{"word":"on","frame":1685},{"word":"the","frame":1689},{"word":"true","frame":1692},{"word":"tone.","frame":1697},{"word":"Odd","frame":1719},{"word":"samples","frame":1722},{"word":"are","frame":1732},{"word":"zero.","frame":1738},{"word":"Now","frame":1752},{"word":"add","frame":1756},{"word":"half","frame":1763},{"word":"of","frame":1768},{"word":"1","frame":1773},{"word":",000","frame":1779},{"word":"Hz","frame":1788},{"word":"to","frame":1793},{"word":"half","frame":1800},{"word":"of","frame":1806},{"word":"7","frame":1810},{"word":",000.","frame":1816},{"word":"On","frame":1839},{"word":"even","frame":1842},{"word":"samples,","frame":1848},{"word":"the","frame":1863},{"word":"halves","frame":1865},{"word":"agree","frame":1872},{"word":"and","frame":1880},{"word":"add","frame":1884},{"word":"up.","frame":1889},{"word":"On","frame":1897},{"word":"odd","frame":1902},{"word":"samples,","frame":1908},{"word":"they're","frame":1923},{"word":"opposite.","frame":1925},{"word":"And","frame":1947},{"word":"cancel","frame":1951},{"word":"to","frame":1960},{"word":"zero,","frame":1965},{"word":"exactly","frame":1979},{"word":"the","frame":1986},{"word":"bridge","frame":1992},{"word":"output.","frame":1998}]},{"line":6,"text":"Why? Each step of the seven thousand dot is a flip, a half turn, then twenty-two and a half degrees back. On even samples the flips pair up into whole turns, so it sits at the hum's mirror spot, the same shadow. On odd samples one flip is left, so the shadow is opposite.","clip":"/Users/cleiton.loiola/personal/lessons/dsp-oppenheim/05-changing-the-rate/4-video/vo-fix2/line02.wav","at":68.02,"start":68.02,"end":80.84,"start_frame":2041,"words":[{"word":"Why?","frame":2041},{"word":"Each","frame":2057},{"word":"step","frame":2065},{"word":"of","frame":2072},{"word":"the","frame":2076},{"word":"7000","frame":2079},{"word":"dot","frame":2095},{"word":"is","frame":2103},{"word":"a","frame":2108},{"word":"flip,","frame":2111},{"word":"a","frame":2123},{"word":"half","frame":2125},{"word":"turn,","frame":2130},{"word":"then","frame":2143},{"word":"22","frame":2146},{"word":"and","frame":2157},{"word":"a","frame":2162},{"word":"half","frame":2165},{"word":"degrees","frame":2169},{"word":"back.","frame":2177},{"word":"On","frame":2194},{"word":"even","frame":2197},{"word":"samples,","frame":2202},{"word":"the","frame":2218},{"word":"flips","frame":2219},{"word":"pair","frame":2226},{"word":"up","frame":2234},{"word":"into","frame":2240},{"word":"whole","frame":2245},{"word":"turns,","frame":2250},{"word":"so","frame":2262},{"word":"it","frame":2270},{"word":"sits","frame":2273},{"word":"at","frame":2278},{"word":"the","frame":2282},{"word":"hum's","frame":2284},{"word":"mirror","frame":2292},{"word":"spot,","frame":2299},{"word":"the","frame":2314},{"word":"same","frame":2314},{"word":"shadow.","frame":2320},{"word":"On","frame":2336},{"word":"odd","frame":2343},{"word":"samples,","frame":2350},{"word":"one","frame":2364},{"word":"flip","frame":2368},{"word":"is","frame":2374},{"word":"left,","frame":2379},{"word":"so","frame":2390},{"word":"the","frame":2393},{"word":"shadow","frame":2396},{"word":"is","frame":2404},{"word":"opposite.","frame":2408}]},{"line":7,"text":"So the zeros were never silence. They're your tone at half height, plus a second tone, called an image. Upsampling makes one for every tone, at eight thousand hertz minus the tone, mirrored across four thousand. [surprise-oh] A whole voice comes back upside down, from four thousand six hundred to seven thousand seven hundred hertz.","clip":"/Users/cleiton.loiola/personal/lessons/dsp-oppenheim/05-changing-the-rate/4-video/vo/line07.wav","at":82.04,"start":82.04,"end":98.32,"start_frame":2461,"words":[{"word":"So","frame":2461},{"word":"the","frame":2470},{"word":"zeros","frame":2474},{"word":"were","frame":2484},{"word":"never","frame":2491},{"word":"silenced.","frame":2498},{"word":"They're","frame":2518},{"word":"your","frame":2525},{"word":"tone","frame":2528},{"word":"at","frame":2536},{"word":"half","frame":2542},{"word":"height,","frame":2550},{"word":"plus","frame":2560},{"word":"a","frame":2567},{"word":"second","frame":2571},{"word":"tone,","frame":2579},{"word":"called","frame":2592},{"word":"an","frame":2597},{"word":"image.","frame":2602},{"word":"Upsampling","frame":2624},{"word":"makes","frame":2639},{"word":"one","frame":2648},{"word":"for","frame":2657},{"word":"every","frame":2664},{"word":"tone,","frame":2673},{"word":"at","frame":2687},{"word":"8","frame":2693},{"word":",000","frame":2700},{"word":"Hz","frame":2710},{"word":"minus","frame":2716},{"word":"the","frame":2726},{"word":"tone,","frame":2733},{"word":"mirrored","frame":2747},{"word":"across","frame":2755},{"word":"4","frame":2763},{"word":",000.","frame":2774},{"word":"Oh,","frame":2794},{"word":"a","frame":2798},{"word":"whole","frame":2800},{"word":"voice","frame":2806},{"word":"comes","frame":2815},{"word":"back","frame":2823},{"word":"upside","frame":2830},{"word":"down,","frame":2842},{"word":"from","frame":2857},{"word":"4","frame":2860},{"word":",600","frame":2870},{"word":"to","frame":2891},{"word":"7","frame":2900},{"word":",700","frame":2909},{"word":"Hz.","frame":2930}]},{"line":8,"text":"After the zeros, the bridge needs a low-pass filter, gain two below four thousand to undo the halving, and zero above. Averaging a gap's two neighbors slopes too gently. A longer rule steps more steeply. Thirty-one samples keeps the voice, and every image under eight percent.","clip":"/Users/cleiton.loiola/personal/lessons/dsp-oppenheim/05-changing-the-rate/4-video/vo-fix2/line03.wav","at":99.12,"start":99.12,"end":112.6,"start_frame":2974,"words":[{"word":"After","frame":2974},{"word":"the","frame":2986},{"word":"zeros,","frame":2990},{"word":"the","frame":3005},{"word":"bridge","frame":3007},{"word":"needs","frame":3013},{"word":"a","frame":3019},{"word":"low","frame":3023},{"word":"-pass","frame":3028},{"word":"filter,","frame":3034},{"word":"gain","frame":3047},{"word":"two","frame":3054},{"word":"below","frame":3060},{"word":"4","frame":3067},{"word":",000","frame":3075},{"word":"to","frame":3085},{"word":"undo","frame":3090},{"word":"the","frame":3098},{"word":"halving,","frame":3103},{"word":"and","frame":3118},{"word":"zero","frame":3126},{"word":"above.","frame":3133},{"word":"Averaging","frame":3154},{"word":"a","frame":3164},{"word":"gap's","frame":3168},{"word":"two","frame":3179},{"word":"neighbors","frame":3185},{"word":"slopes","frame":3194},{"word":"too","frame":3205},{"word":"gently.","frame":3212},{"word":"A","frame":3233},{"word":"longer","frame":3234},{"word":"rule","frame":3241},{"word":"steps","frame":3249},{"word":"more","frame":3257},{"word":"steeply.","frame":3264},{"word":"31","frame":3290},{"word":"samples","frame":3296},{"word":"keeps","frame":3308},{"word":"the","frame":3316},{"word":"voice","frame":3321},{"word":"and","frame":3328},{"word":"every","frame":3334},{"word":"image","frame":3340},{"word":"under","frame":3349},{"word":"8%.","frame":3356}]},{"line":9,"text":"Going down, the bridge keeps every other sample. That's downsampling. The hiss of an S, at six thousand hertz, lands on your line as a two thousand hertz squeal, an alias across the same mirror. So the low-pass filter goes first, gain one, while six thousand is still six thousand.","clip":"/Users/cleiton.loiola/personal/lessons/dsp-oppenheim/05-changing-the-rate/4-video/vo-fix2/line04.wav","at":113.4,"start":113.4,"end":126.94,"start_frame":3402,"words":[{"word":"Going","frame":3402},{"word":"down","frame":3413},{"word":"the","frame":3419},{"word":"bridge","frame":3424},{"word":"keeps","frame":3430},{"word":"every","frame":3439},{"word":"other","frame":3446},{"word":"sample,","frame":3452},{"word":"that's","frame":3469},{"word":"downsampling.","frame":3478},{"word":"The","frame":3507},{"word":"hiss","frame":3509},{"word":"of","frame":3515},{"word":"an","frame":3518},{"word":"S","frame":3521},{"word":"at","frame":3528},{"word":"6000Hz","frame":3532},{"word":"lands","frame":3553},{"word":"on","frame":3564},{"word":"your","frame":3569},{"word":"line","frame":3572},{"word":"as","frame":3579},{"word":"a","frame":3583},{"word":"2000Hz","frame":3586},{"word":"squeal,","frame":3607},{"word":"an","frame":3622},{"word":"alias","frame":3628},{"word":"across","frame":3641},{"word":"the","frame":3650},{"word":"same","frame":3658},{"word":"mirror.","frame":3664},{"word":"So","frame":3683},{"word":"the","frame":3687},{"word":"low","frame":3691},{"word":"-pass","frame":3695},{"word":"filter","frame":3701},{"word":"goes","frame":3709},{"word":"first,","frame":3716},{"word":"gain","frame":3733},{"word":"1,","frame":3739},{"word":"while","frame":3752},{"word":"6000","frame":3759},{"word":"is","frame":3772},{"word":"still","frame":3780},{"word":"6000.","frame":3785}]},{"line":10,"text":"Upsampling never adds detail. The best bridge adds almost nothing above four thousand, and ours leaves a faint seven percent. [sigh] Then a new ticket. A thin whine on every call, exactly four thousand hertz, on the mirror line.","clip":"/Users/cleiton.loiola/personal/lessons/dsp-oppenheim/05-changing-the-rate/4-video/vo-fix2/line05.wav","at":128.14,"start":128.14,"end":139.25,"start_frame":3844,"words":[{"word":"Upsampling","frame":3844},{"word":"never","frame":3865},{"word":"adds","frame":3872},{"word":"detail,","frame":3880},{"word":"the","frame":3899},{"word":"best","frame":3904},{"word":"bridge","frame":3910},{"word":"adds","frame":3917},{"word":"almost","frame":3925},{"word":"nothing","frame":3932},{"word":"above","frame":3940},{"word":"4","frame":3948},{"word":",000","frame":3957},{"word":"and","frame":3968},{"word":"ours","frame":3974},{"word":"leaves","frame":3983},{"word":"a","frame":3991},{"word":"faint","frame":3996},{"word":"7%.","frame":4002},{"word":"Aye,","frame":4030},{"word":"then","frame":4039},{"word":"a","frame":4043},{"word":"new","frame":4046},{"word":"ticket.","frame":4049},{"word":"A","frame":4063},{"word":"thin","frame":4069},{"word":"whine","frame":4074},{"word":"on","frame":4082},{"word":"every","frame":4086},{"word":"call,","frame":4093},{"word":"exactly","frame":4105},{"word":"4","frame":4117},{"word":",000","frame":4126},{"word":"Hz","frame":4138},{"word":"on","frame":4145},{"word":"the","frame":4152},{"word":"mirror","frame":4155},{"word":"line.","frame":4161}]}]};
