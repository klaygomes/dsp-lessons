<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Voice Underneath</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="./runtime/fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=block">
<style>
:root {
  --paper: #F6F1E7;
  --paper-2: #ECE4D6;
  --ink: #26272B;
  --ink-soft: #5E5F66;
  --rule: #D9D0C1;
  --accent: #D9573B;
  --accent-ink: #B23F25;
  --accent-soft: #F6D9CF;
  --input: #2F7F7A;
  --input-soft: #D3E7E4;
  --sans: "Geist", "Inter", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --serif: "Instrument Serif", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#main { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 500; }
.scene, .cam, .layer { position: absolute; inset: 0; }
.layer svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
.reveal { --p: 0; --x0: 0px; --w: 1920px; clip-path: inset(-2000px calc(1920px - var(--x0) - var(--p) * var(--w)) -2000px -2000px); }
.lbl { position: absolute; font-family: var(--mono); font-size: 52px; line-height: 62px; white-space: pre; color: var(--ink); }
.lbl.s { font-size: 48px; line-height: 58px; color: var(--ink-soft); }
.lbl.acc { color: var(--accent-ink); }
.lbl.ok { color: var(--input); }
.lbl.big { font-size: 80px; line-height: 96px; }
.lbl.m { font-size: 48px; line-height: 58px; }
.note { position: absolute; font-family: var(--serif); font-style: italic; font-size: 64px; line-height: 76px; white-space: pre; color: var(--ink-soft); }
.note.acc { color: var(--accent-ink); }
</style>
</head>
<body>
<div id="main"></div>

<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const SCHEDULE = /*SCHEDULE*/null;
const FPS = 30;
const M = Motion.film({ fps: FPS, duration: SCHEDULE.duration, width: 1920, height: 1080, clock: 'smooth' });
const C = { ink: '#26272B', soft: '#5E5F66', rule: '#D9D0C1', accent: '#D9573B', accentInk: '#B23F25', accentSoft: '#F6D9CF', input: '#2F7F7A', inputSoft: '#D3E7E4', paper: '#F6F1E7', paper2: '#ECE4D6' };
const main = document.getElementById('main');
const LEAD = 9;
const END = Math.round(SCHEDULE.duration * FPS);
const STILL = END - 36;
const lineStart = i => SCHEDULE.lines[i - 1].start_frame;
const sceneStart = i => Math.max(0, lineStart(i) - LEAD);
const sceneEnd = i => i < SCHEDULE.lines.length ? sceneStart(i + 1) : END;
const MISSES = [], ANCHORS = [];
const norm = s => s.toLowerCase().replace(/[“”"]/g, '').replace(/’/g, "'").replace(/^[^a-z0-9−-]+/, '').replace(/[^a-z0-9%]+$/, '');
const word = (i, forms, nth = 0) => {
  const fs = [].concat(forms);
  const hits = SCHEDULE.lines[i - 1].words.filter(w => fs.includes(norm(w.word)));
  if (!hits[nth]) MISSES.push(`${i}:${fs[0]}:${nth}`);
  const h = hits[nth] || hits[hits.length - 1] || { word: '(none)', frame: lineStart(i) };
  ANCHORS.push({ line: i, form: fs[0], nth, heard: h.word, frame: h.frame });
  return h.frame - 2;
};
let uid = 0;

const range = (a, b, s = 1) => { const o = []; for (let v = a; v <= b + 1e-9; v += s) o.push(v); return o; };
const path = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
const cosd = a => Math.cos(a * Math.PI / 180), sind = a => Math.sin(a * Math.PI / 180);
const pt = (cx, cy, R, a) => [cx + R * cosd(a), cy - R * sind(a)];

function el(tag, attrs, parent, html) { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html !== undefined) e.innerHTML = html; parent.appendChild(e); return e; }
const SCENES = Array.from({ length: SCHEDULE.lines.length }, (_, i) => 's' + (i + 1));
SCENES.forEach(id => { const s = el('section', { id, class: 'scene' }, main); el('div', { id: id + 'cam', class: 'cam' }, s); });
const cam = n => document.getElementById(`s${n}cam`);
function part(parent) { const id = 'P' + (++uid); return [el('div', { id, class: 'layer' }, parent), '#' + id]; }
function layer(parent, inner, reveal) {
  const id = 'L' + (++uid), d = el('div', { id, class: 'layer' + (reveal ? ' reveal' : '') }, parent);
  if (reveal) { d.style.setProperty('--x0', reveal[0] + 'px'); d.style.setProperty('--w', (reveal[1] - reveal[0]) + 'px'); }
  d.innerHTML = `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  return '#' + id;
}
function label(parent, text, x, y, cls = 'lbl', anchor = 'left') {
  const id = 'T' + (++uid), e = el('div', { id, class: cls }, parent); e.textContent = text; e.style.top = y + 'px';
  if (anchor === 'left') e.style.left = x + 'px'; else if (anchor === 'right') e.style.right = (1920 - x) + 'px'; else { e.style.left = (x - 900) + 'px'; e.style.width = '1800px'; e.style.textAlign = 'center'; }
  return '#' + id;
}
const reveal = (sel, a, b, ease = 'softInOut') => M.kf(sel, '--p', [[0, 0], [a, 0], [b, 1, ease]]);
const origin = (sel, x, y) => { document.querySelector(sel).style.transformOrigin = `${x}px ${y}px`; };
const drift = (n, a = 1, b = 1.03, end = sceneEnd(n)) => M.drift(`#s${n}cam`, { prop: 'scale', from: a, to: b, start: sceneStart(n), end });
const grow = (sel, x, y, at, len = 8) => { origin(sel, x, y); M.show(sel, at); M.kf(sel, 'scaleY', [[0, 0], [at, 0], [at + len, 1, 'softLand']]); return sel; };
const fadeIn = (sel, at, len = 10) => { M.show(sel, at); M.kf(sel, 'opacity', [[0, 0], [at, 0], [at + len, 1]]); return sel; };

const hline = (x1, x2, y, color = C.soft, w = 3, dash = '') => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const vline = (x, y1, y2, color = C.soft, w = 3, dash = '') => `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${color}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const seg = (x1, y1, x2, y2, color = C.ink, w = 5, dash = '') => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const curve = (pts, color = C.ink, w = 5, dash = '') => `<path d="${path(pts)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const DASH = '16 11', DOTS = '1 15';
const stemSvg = (x, base, y, color = C.ink, w = 7, r = 15, hollow = false) => `<line x1="${x.toFixed(1)}" y1="${base}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${hollow ? C.paper : color}" stroke="${color}" stroke-width="${hollow ? 5 : 0}"/>`;
const dotSvg = (x, y, r = 16, color = C.ink) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${color}"/>`;
const ringSvg = (x, y, r = 16, color = C.ink, w = 5) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${C.paper}" stroke="${color}" stroke-width="${w}"/>`;
const sq = (x, y, s = 14, color = C.ink, fill = C.ink) => `<rect x="${(x - s).toFixed(1)}" y="${(y - s).toFixed(1)}" width="${2 * s}" height="${2 * s}" fill="${fill}" stroke="${color}" stroke-width="4"/>`;
const box = (x, y, w, h, stroke = C.ink, fill = C.paper, sw = 4) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" rx="8"/>`;
function tick(c, x, y, s = 1) { return layer(c, `<path d="M ${x} ${y} l ${16 * s} ${18 * s} l ${34 * s} ${-40 * s}" fill="none" stroke="${C.input}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`); }
const rnd = k => { const v = Math.sin(k * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
const flicker = (sel, a, b, lo = 0.75, seed = 0) => { const keys = [[0, 1], [a, 1]]; for (let f = a + 2; f < b - 2; f += 2) keys.push([f, lo + (1 - lo) * rnd(f + seed)]); keys.push([b, 1]); M.kf(sel, 'opacity', keys); };
const arrowSvg = (x1, y1, x2, y2, color = C.ink, w = 6, dash = '', open = false) => {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 30, s = 15;
  const bx = x2 - h * Math.cos(a), by = y2 - h * Math.sin(a);
  const p1 = [bx + s * Math.sin(a), by - s * Math.cos(a)], p2 = [bx - s * Math.sin(a), by + s * Math.cos(a)];
  return seg(x1, y1, bx, by, color, w, dash) + `<path d="M${x2.toFixed(1)} ${y2.toFixed(1)}L${p1[0].toFixed(1)} ${p1[1].toFixed(1)}L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}Z" fill="${open ? C.paper : color}" stroke="${color}" stroke-width="4" stroke-linejoin="round"/>`;
};
const topArrow = (x, y, len, a, color = C.ink) => { const [u, v] = pt(x, y, len, a); return arrowSvg(x, y, u, v, color, 8); };
const mirArrow = (x, y, len, a, color = C.ink) => { const [u, v] = pt(x, y, len, a); return arrowSvg(x, y, u, v, color, 8, DOTS, true); };
const refArrow = (x, y, len, a) => { const [u, v] = pt(x, y, len, a); return arrowSvg(x, y, u, v, C.soft, 4, '12 9'); };
const wheel = (x, y, R) => `<circle cx="${x}" cy="${y}" r="${R}" fill="none" stroke="${C.soft}" stroke-width="3"/>` + hline(x - R - 30, x + R + 30, y, C.rule, 3) + vline(x, y - R - 30, y + R + 30, C.rule, 3);
const stepped = (c, a, b, stepF, draw) => {
  const n = Math.max(1, Math.floor((b - a) / stepF));
  for (let k = 0; k <= n; k++) { const from = a + k * stepF, to = k === n ? b : a + (k + 1) * stepF; M.show(layer(c, draw(from)), from, to > from ? to : from + 1); }
};
const turnAt = (f, a0, segs) => { let a = a0, t = segs[0][0]; segs.forEach(([from, rate], k) => { const to = k + 1 < segs.length ? segs[k + 1][0] : Infinity; if (f > from) a += rate * (Math.min(f, to) - from); }); return a; };
const SPS = 12;
const hatch = id => `<defs><pattern id="${id}" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="${C.accentSoft}"/><line x1="0" y1="0" x2="0" y2="18" stroke="${C.accent}" stroke-width="6"/></pattern></defs>`;
const fmt = (v, d = 3) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const hz = v => Math.round(v).toLocaleString('en-US');

const hann = (n, D) => 0.5 + 0.5 * Math.cos(Math.PI * n / (D + 1));
const gainOf = (N, win, f) => { const D = (N - 1) / 2, w = 2 * Math.PI * f / 8000; let s = 0; for (let n = 1; n <= D; n += 2) s += 2 * (2 / (Math.PI * n)) * (win ? hann(n, D) : 1) * Math.sin(w * n); return s; };
const ghostOf = G => Math.abs(1 - G) / (1 + G);
const worst = N => { let m = 0, at = 300; for (let f = 300; f <= 3400; f += 5) { const g = ghostOf(gainOf(N, true, f)); if (g > m) { m = g; at = f; } } return [m, at]; };
const voiceAt = (t, ph) => { const env = 0.55 + 0.45 * Math.sin(t * 0.21 + 0.7) * Math.sin(t * 0.083 + ph); return env * (0.6 * Math.sin(t) + 0.3 * Math.sin(2.7 * t + 1) + 0.18 * Math.sin(5.3 * t + 2)); };
const waveRow = (x0, x1, y, amp, ph, k = 1, color = C.ink, w = 5, dash = '') => curve(range(x0, x1, 4).map(x => [x, y - amp * voiceAt((x - x0) / 26 * k + ph, ph * 0.01)]), color, w, dash);

function shifter(c, delay, dy = 0) {
  const yT = 250 + dy, yB = 610 + dy, yM = 430 + dy, xs = 330, xMt = 1060, xMb = 1180, xS = 1440;
  let s = '';
  s += arrowSvg(160, yM, xs, yM, C.ink, 5) + dotSvg(xs, yM, 10);
  s += seg(xs, yM, xs, yT, C.ink, 5) + seg(xs, yM, xs, yB, C.ink, 5);
  s += delay ? seg(xs, yT, 520, yT, C.ink, 5) + seg(820, yT, xMt - 46, yT, C.ink, 5) : seg(xs, yT, xMt - 46, yT, C.ink, 5);
  s += seg(xs, yB, 430, yB, C.ink, 5) + box(430, yB - 70, 580, 140, C.ink, C.paper2) + seg(1010, yB, xMb - 46, yB, C.ink, 5);
  s += ringSvg(xMt, yT, 46, C.ink, 5) + ringSvg(xMb, yB, 46, C.ink, 5);
  s += seg(xMt - 18, yT - 18, xMt + 18, yT + 18, C.ink, 5) + seg(xMt - 18, yT + 18, xMt + 18, yT - 18, C.ink, 5);
  s += seg(xMb - 18, yB - 18, xMb + 18, yB + 18, C.ink, 5) + seg(xMb - 18, yB + 18, xMb + 18, yB - 18, C.ink, 5);
  s += arrowSvg(xMt + 46, yT, xS - 30, yM - 40, C.ink, 5) + arrowSvg(xMb + 46, yB, xS - 30, yM + 40, C.ink, 5);
  s += ringSvg(xS, yM, 50, C.ink, 5) + seg(xS - 22, yM, xS + 22, yM, C.ink, 6) + seg(xS, yM - 22, xS, yM + 22, C.ink, 6);
  s += arrowSvg(xS + 50, yM, 1720, yM, C.ink, 5);
  return { svg: s, yT, yB, yM, xMt, xMb, xS };
}

{
  const c = cam(1);
  const di = word(1, 'disguise'), th = word(1, ['three', '300']), mu = word(1, 'multiply');
  label(c, 'a newspaper’s tip line', 160, 84, 'lbl s');
  M.show(label(c, 'a caller', 160, 200, 'lbl s'), word(1, 'voice'));
  stepped(c, 0, sceneEnd(1), 2, f => waveRow(160, 680, 430, 120, f * 0.12, 1) + (f >= mu ? waveRow(1240, 1760, 430, 120, f * 0.12, 1.25) : ''));
  M.show(label(c, 'goal: disguise every voice', 160, 640, 'lbl ok'), di);
  M.show(label(c, 'every tone + 300 Hz', 160, 730, 'lbl'), th);
  fadeIn(layer(c, box(760, 300, 400, 260, C.ink, C.paper2) + curve(range(800, 1120, 3).map(x => [x, 480 - 34 * Math.sin((x - 800) / 16)]), C.input, 5) + arrowSvg(690, 430, 750, 430, C.ink, 5) + arrowSvg(1170, 430, 1230, 430, C.ink, 5)), mu, 8);
  M.show(label(c, '× 300 Hz tone', 960, 220, 'lbl ok', 'center'), mu);
  M.show(label(c, 'disguised', 1760, 640, 'lbl s', 'right'), mu + 6);
  drift(1);
}
{
  const c = cam(2);
  const se = word(2, 'second'), lo = word(2, 'loud'), lw = word(2, 'lower'), wh = word(2, 'where'), mu = word(2, 'multiplied');
  label(c, 'the reporters hear:', 160, 84, 'lbl s');
  label(c, 'the disguised voice', 160, 150, 'lbl');
  stepped(c, 0, sceneEnd(2), 2, f => waveRow(160, 1760, 340, 110, f * 0.12, 1.25) + (f >= se ? waveRow(160, 1760, 630, 110, f * 0.12, 0.85, C.accent, 5, '14 8') : ''));
  M.show(label(c, 'a second voice', 160, 460, 'lbl acc'), se);
  M.show(label(c, 'just as loud', 1760, 460, 'lbl acc', 'right'), lo);
  M.show(label(c, 'a little lower', 1760, 770, 'lbl acc', 'right'), lw);
  M.show(label(c, '?', 960, 440, 'lbl big acc', 'center'), wh);
  M.show(label(c, 'you only multiplied', 160, 770, 'lbl s'), mu);
  drift(2);
}
{
  const c = cam(3);
  const th = word(3, ['thousand', '1000', '1,000']), ei = word(3, ['eight', '8']), ha = word(3, 'half'), se = word(3, ['seven', '700']), sa = word(3, 'sample', 1), sp = word(3, 'split'), wa = word(3, 'wanted'), gh = word(3, 'ghost');
  const [pa, pA] = part(c), [pb, pB] = part(c);
  M.show(pA, 0, sp); M.show(pB, sp);
  const xN = n => 760 + n * 140, rows = [230, 450, 690], amp = 90;
  const r1 = range(0, 7).map(n => cosd(45 * n)), r2 = range(0, 7).map(n => cosd(13.5 * n)), pr = r1.map((v, n) => v * r2[n]);
  const half = range(0, 7).map(n => 0.5 * cosd(58.5 * n) + 0.5 * cosd(31.5 * n));
  M.show(label(pa, '1,000 Hz', 160, rows[0] - 31), th);
  M.show(label(pa, '× 300 Hz', 160, rows[1] - 31, 'lbl ok'), ei);
  M.show(label(pa, '= product', 160, rows[2] - 31), ei + 10);
  M.show(label(pa, 'n = 0 … 7, eight samples', 1780, 84, 'lbl s', 'right'), ei);
  rows.forEach((y, k) => layer(pa, hline(xN(0) - 50, xN(7) + 50, y, C.rule, 3)));
  grow(layer(pa, r1.map((v, n) => stemSvg(xN(n), rows[0], rows[0] - amp * v)).join('')), 960, rows[0], sceneStart(3), 10);
  grow(layer(pa, r2.map((v, n) => stemSvg(xN(n), rows[1], rows[1] - amp * v, C.input)).join('')), 960, rows[1], ei, 10);
  grow(layer(pa, pr.map((v, n) => stemSvg(xN(n), rows[2], rows[2] - amp * v)).join('')), 960, rows[2], ei + 10, 10);
  fadeIn(layer(pa, half.map((v, n) => ringSvg(xN(n), rows[2] - amp * v, 26, C.accent, 5)).join('')), se, 8);
  M.show(label(pa, 'sounds as: ½ 1,300 Hz + ½ 700 Hz', 160, 764, 'lbl s acc'), se);
  M.show(label(pa, 'every sample matches', 160, 84, 'lbl s ok'), sa);
  const X = f => 260 + f * 0.33, Y = v => 700 - v * 440;
  layer(pb, hline(X(0), X(4000) + 20, Y(0), C.ink, 3) + [0, 1000, 2000, 3000, 4000].map(f => vline(X(f), Y(0), Y(0) + 12, C.ink, 3)).join(''));
  [0, 1000, 2000, 3000, 4000].forEach(f => label(pb, f === 4000 ? '4,000 Hz' : hz(f), X(f), Y(0) + 26, 'lbl s', 'center'));
  label(pb, 'one tone, × a 300 Hz tone', 160, 84, 'lbl s');
  layer(pb, `<rect x="${X(1000) - 18}" y="${Y(1)}" width="36" height="${Y(0) - Y(1)}" fill="none" stroke="${C.soft}" stroke-width="4" stroke-dasharray="12 9"/>`);
  label(pb, 'call tone, 1,000 Hz', X(1000), Y(1) - 70, 'lbl s', 'center');
  stepped(pb, sp, sceneEnd(3), 2, f => { const p = Math.min(1, Math.max(0, (f - sp) / 20)), e = p * p * (3 - 2 * p), d = 300 * e * 0.36;
    return hatch('h3' + f) + `<rect x="${X(1000) - 22 + d}" y="${Y(0.5)}" width="44" height="${Y(0) - Y(0.5)}" fill="${C.ink}"/><rect x="${X(1000) - 22 - d}" y="${Y(0.5)}" width="44" height="${Y(0) - Y(0.5)}" fill="url(#h3${f})" stroke="${C.accent}" stroke-width="4"/>`; });
  M.show(label(pb, 'wanted copy, 1,300', X(1300) + 40, Y(0.5) - 40, 'lbl'), wa);
  M.show(label(pb, 'ghost, 700', X(700) - 40, Y(0.5) - 40, 'lbl acc', 'right'), gh);
  M.show(label(pb, '½', X(1300) + 40, Y(0.5) + 30, 'lbl s'), wa);
  M.show(label(pb, '½', X(700) - 40, Y(0.5) + 30, 'lbl s', 'right'), gh);
  drift(3);
}
{
  const c = cam(4);
  const vo = word(4, 'voice'), gh = word(4, 'ghosts'), wa = word(4, 'wanted'), sv = word(4, ['seventeen', '1700', '1,700']), te = word(4, 'tell');
  const X = f => 300 + f * 0.33, rows = [160, 310, 460], H = 90;
  const ax = 600;
  layer(c, hline(X(0), X(4000) + 20, ax, C.ink, 3) + [0, 1000, 2000, 3000, 4000].map(f => vline(X(f), ax, ax + 12, C.ink, 3)).join(''));
  [0, 1000, 2000, 3000, 4000].forEach(f => label(c, f === 4000 ? '4,000 Hz' : hz(f), X(f), ax + 26, 'lbl s', 'center'));
  const band = (a, b, y, fill, stroke, dash = '') => `<rect x="${X(a).toFixed(1)}" y="${y}" width="${(X(b) - X(a)).toFixed(1)}" height="${H}" fill="${fill}" stroke="${stroke}" stroke-width="4"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  M.show(label(c, 'voice, 300 to 3,400', X(300), rows[0] - 64, 'lbl s'), vo);

  M.show(label(c, 'delay: ?', 750, 756, 'lbl acc', 'center'), de);
  M.show(label(c, 'send a click? no', 1760, 640, 'lbl acc', 'right'), cl);
  drift(12, 1, 1.03, STILL);
}
SCENES.forEach((id, i) => { if (i === 0) return; M.cut(sceneStart(i + 1), { hide: [`#${SCENES[i - 1]}`], show: [`#${id}`] }); M.hide(`#${id}`, 0); });
window.__misses = MISSES;
window.__anchors = ANCHORS;
window.__hero = HERO;
if (MISSES.length) console.error('word anchors missing: ' + MISSES.join(' '));
window.__ready = Motion.loaded().then(() => { if (/selftest/.test(location.search)) Motion.selfTest(M, { samples: 24 }); });
</script>
