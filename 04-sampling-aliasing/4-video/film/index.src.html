<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Whistle That Changed Its Mind</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="./runtime/fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=block">
<style>
:root {
  --paper: #F6F1E7;
  --paper-2: #ECE4D6;
  --ink: #26272B;
  --ink-soft: #5E5F66;
  --rule: #D9D0C1;
  --accent: #D9573B;
  --accent-ink: #B23F25;
  --accent-soft: #F6D9CF;
  --input: #2F7F7A;
  --input-soft: #D3E7E4;
  --sans: "Geist", "Inter", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --serif: "Instrument Serif", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#main { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 500; }
.scene, .cam, .layer { position: absolute; inset: 0; }
.layer svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
.reveal { --p: 0; --x0: 0px; --w: 1920px; clip-path: inset(-2000px calc(1920px - var(--x0) - var(--p) * var(--w)) -2000px -2000px); }
.lbl { position: absolute; font-family: var(--mono); font-size: 52px; line-height: 62px; white-space: pre; color: var(--ink); }
.lbl.s { font-size: 48px; line-height: 58px; color: var(--ink-soft); }
.lbl.acc { color: var(--accent-ink); }
.lbl.ok { color: var(--input); }
.lbl.big { font-size: 80px; line-height: 96px; }
.note { position: absolute; font-family: var(--serif); font-style: italic; font-size: 64px; line-height: 76px; white-space: pre; color: var(--ink-soft); }
.dot { position: absolute; border-radius: 50%; }
.box { position: absolute; background: var(--paper-2); border: 4px solid var(--ink); border-radius: 10px; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--mono); font-size: 50px; line-height: 62px; white-space: pre; }
.box.hot { background: var(--accent-soft); border-color: var(--accent); }
.box.good { background: var(--input-soft); border-color: var(--input); }
</style>
</head>
<body>
<div id="main"></div>

<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const SCHEDULE = /*SCHEDULE*/null;
const FPS = 30;
const M = Motion.film({ fps: FPS, duration: SCHEDULE.duration, width: 1920, height: 1080, clock: 'smooth' });
const C = { ink: '#26272B', soft: '#5E5F66', rule: '#D9D0C1', accent: '#D9573B', accentInk: '#B23F25', accentSoft: '#F6D9CF', input: '#2F7F7A', inputSoft: '#D3E7E4', paper: '#F6F1E7', paper2: '#ECE4D6' };
const main = document.getElementById('main');
const LEAD = 9;
const END = Math.round(SCHEDULE.duration * FPS);
const lineStart = i => SCHEDULE.lines[i - 1].start_frame;
const sceneStart = i => Math.max(0, lineStart(i) - LEAD);
const sceneEnd = i => i < SCHEDULE.lines.length ? sceneStart(i + 1) : END;
const MISSES = [];
const word = (i, forms, nth = 0) => {
  const fs = [].concat(forms);
  const hits = SCHEDULE.lines[i - 1].words.filter(w => { const t = w.word.toLowerCase().replace(/[^a-z0-9.,%'−-]/g, ''); return fs.some(f => t.startsWith(f)); });
  if (!hits[nth]) MISSES.push(`${i}:${fs[0]}:${nth}`);
  return (hits[nth] || hits[hits.length - 1] || { frame: lineStart(i) }).frame - 2;
};
let uid = 0;

const fmt = (v, d = 2) => (v < -0.0005 ? '−' : '') + Math.abs(v).toFixed(d);
const num = v => Math.abs(v) < 0.005 ? '0' : Math.abs(Math.abs(v) - 1) < 0.005 ? (v < 0 ? '−1' : '1') : fmt(v);
const path = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
const cosd = a => Math.cos(a * Math.PI / 180), sind = a => Math.sin(a * Math.PI / 180);
const pt = (cx, cy, R, a) => [cx + R * cosd(a), cy - R * sind(a)];
const arcD = (cx, cy, r, a0, a1) => {
  const dir = a1 >= a0 ? 1 : -1, sweep = dir > 0 ? 0 : 1;
  let a = a0, d = 'M' + pt(cx, cy, r, a0).map(v => v.toFixed(1)).join(' ');
  while (Math.abs(a1 - a) > 1e-9) { const b = dir > 0 ? Math.min(a + 170, a1) : Math.max(a - 170, a1); d += `A${r} ${r} 0 0 ${sweep} ${pt(cx, cy, r, b).map(v => v.toFixed(1)).join(' ')}`; a = b; }
  return d;
};
const hz = f => f.toLocaleString('en-US');

function el(tag, attrs, parent, html) { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html !== undefined) e.innerHTML = html; parent.appendChild(e); return e; }
const SCENES = Array.from({ length: SCHEDULE.lines.length }, (_, i) => 's' + (i + 1));
SCENES.forEach(id => { const s = el('section', { id, class: 'scene' }, main); el('div', { id: id + 'cam', class: 'cam' }, s); });
const cam = n => document.getElementById(`s${n}cam`);
function sub(parent) { const id = 'P' + (++uid); el('div', { id, class: 'layer' }, parent); return document.getElementById(id); }
function layer(parent, inner, reveal) {
  const id = 'L' + (++uid), d = el('div', { id, class: 'layer' + (reveal ? ' reveal' : '') }, parent);
  if (reveal) { d.style.setProperty('--x0', reveal[0] + 'px'); d.style.setProperty('--w', (reveal[1] - reveal[0]) + 'px'); }
  d.innerHTML = `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  return '#' + id;
}
function label(parent, text, x, y, cls = 'lbl', anchor = 'left') {
  const id = 'T' + (++uid), e = el('div', { id, class: cls }, parent); e.textContent = text; e.style.top = y + 'px';
  if (anchor === 'left') e.style.left = x + 'px'; else if (anchor === 'right') e.style.right = (1920 - x) + 'px'; else { e.style.left = (x - 900) + 'px'; e.style.width = '1800px'; e.style.textAlign = 'center'; }
  return '#' + id;
}
function box(parent, text, x, y, w, h, cls = 'box') {
  const id = 'X' + (++uid), e = el('div', { id, class: cls }, parent); e.textContent = text;
  Object.assign(e.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  return '#' + id;
}
function dot(parent, x, y, r, color, hollow) {
  const id = 'D' + (++uid), e = el('div', { id, class: 'dot' }, parent);
  Object.assign(e.style, { left: (x - r) + 'px', top: (y - r) + 'px', width: 2 * r + 'px', height: 2 * r + 'px', background: hollow ? C.paper : color, border: hollow ? `6px solid ${color}` : 'none' });
  return '#' + id;
}
const reveal = (sel, a, b, ease = 'softInOut') => M.kf(sel, '--p', [[0, 0], [a, 0], [b, 1, ease]]);
const travel = (sel, pts) => { M.kf(sel, 'x', pts.map(([f, x, , e]) => [f, x, e])); M.kf(sel, 'y', pts.map(([f, , y, e]) => [f, y, e])); };
const origin = (sel, x, y) => { document.querySelector(sel).style.transformOrigin = `${x}px ${y}px`; };
const drift = (n, a = 1, b = 1.03) => M.drift(`#s${n}cam`, { prop: 'scale', from: a, to: b, start: sceneStart(n), end: sceneEnd(n) });

const hline = (x1, x2, y, color = C.soft, w = 3, dash = '') => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const vline = (x, y1, y2, color = C.soft, w = 3, dash = '') => `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${color}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const WAVE = { true: `fill="none" stroke="${C.soft}" stroke-width="6" stroke-dasharray="20 14"`, acc: `fill="none" stroke="${C.accent}" stroke-width="7" stroke-linejoin="round"` };
const stemSvg = (x, base, y) => `<line x1="${x}" y1="${base}" x2="${x}" y2="${y}" stroke="${C.ink}" stroke-width="7" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="15" fill="${C.ink}"/>`;
function stem(c, x, base, y, at) {
  const sel = layer(c, stemSvg(x, base, y));
  origin(sel, x, base); M.show(sel, at); M.kf(sel, 'scaleY', [[0, 0], [at, 0], [at + 8, 1, 'softLand']]);
  return sel;
}
const head = (x1, y1, x2, y2, len, half) => {
  const d = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / d, uy = (y2 - y1) / d, bx = x2 - ux * len, by = y2 - uy * len;
  return { bx, by, pts: `${x2.toFixed(1)},${y2.toFixed(1)} ${(bx - uy * half).toFixed(1)},${(by + ux * half).toFixed(1)} ${(bx + uy * half).toFixed(1)},${(by - ux * half).toFixed(1)}` };
};
const vecSvg = (x1, y1, x2, y2, color = C.ink, w = 6) => { const h = head(x1, y1, x2, y2, 28, 14); return `<line x1="${x1}" y1="${y1}" x2="${h.bx.toFixed(1)}" y2="${h.by.toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${h.pts}" fill="${color}"/>`; };
const arcArrow = (cx, cy, r, a0, a1, color = C.ink, w = 6, dash = '') => {
  const dir = a1 >= a0 ? 1 : -1, back = a1 - dir * 9, [x1, y1] = pt(cx, cy, r, back), [x2, y2] = pt(cx, cy, r, a1);
  const h = head(x1, y1, x2, y2, 26, 14);
  return `<path d="${arcD(cx, cy, r, a0, back)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/><polygon points="${h.pts}" fill="${color}"/>`;
};
function tick(c, x, y, s = 1) { return layer(c, `<path d="M ${x} ${y} l ${16 * s} ${18 * s} l ${34 * s} ${-40 * s}" fill="none" stroke="${C.input}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`); }
function cross(c, x, y, s = 1) { return layer(c, `<g stroke="${C.accent}" stroke-width="9" stroke-linecap="round"><line x1="${x}" y1="${y - 20 * s}" x2="${x + 40 * s}" y2="${y + 20 * s}"/><line x1="${x + 40 * s}" y1="${y - 20 * s}" x2="${x}" y2="${y + 20 * s}"/></g>`); }
const arrowH = (x1, x2, y, color = C.soft) => vecSvg(x1, y, x2, y, color, 5);

function scrollWave(c, f, yc, amp, kind, start, end, pxPerSample = 150, speed = 5, jitter = 0) {
  const len = 1920 + speed * (end - start) + 200, pts = [];
  for (let x = -100; x <= len; x += 3) {
    const n = x / pxPerSample, j = jitter ? jitter * (Math.sin(x * 0.37) * 0.6 + Math.sin(x * 0.113 + 1.3) * 0.4) : 0;
    pts.push([x, yc - amp * (cosd(360 * f * n / 8000) + j)]);
  }
  const strip = sub(c);
  M.kf('#' + strip.id, 'x', [[start, 0], [end, -speed * (end - start)]]);
  return layer(strip, `<path d="${path(pts)}" ${WAVE[kind]}/>`);
}
function chain(c, names, x0, y, w, h, gap, cls = {}) {
  const sels = names.map((n, i) => box(c, n, x0 + i * (w + gap), y, w, h, cls[i] ? 'box ' + cls[i] : 'box'));
  const arrows = names.slice(1).map((_, i) => layer(c, arrowH(x0 + i * (w + gap) + w + 6, x0 + (i + 1) * (w + gap) - 8, y + h / 2)));
  return { sels, arrows, x: i => x0 + i * (w + gap) };
}

{
  const c = cam(1), s1 = 0, e1 = sceneEnd(1);
  const cl = word(1, 'clinic'), f5 = word(1, '5'), t3 = word(1, '3'), fz = word(1, 'fuzzy'), cn = word(1, 'clean');
  M.show(label(c, 'the east route: crisp again', 960, 440, 'lbl ok', 'center'), 0, cl);
  M.show(tick(c, 1430, 480), 0, cl);
  M.show(label(c, 'next ticket: a hearing clinic', 960, 40, 'lbl', 'center'), cl);
  M.show(layer(c, hline(0, 1920, 370, C.rule) + hline(0, 1920, 720, C.rule)), cl);
  M.show(scrollWave(c, 5000, 370, 110, 'true', s1, e1), word(1, 'whistles'));
  M.show(label(c, 'the clinic plays 5,000 Hz', 120, 170, 'lbl'), f5);
  M.show(scrollWave(c, 3000, 720, 110, 'acc', s1, e1), t3);
  M.show(label(c, 'every patient hears 3,000 Hz', 120, 520, 'lbl acc'), t3);
  M.show(label(c, 'fuzzy?', 1800, 170, 'lbl s', 'right'), fz, cn);
  M.show(cross(c, 1810, 202), fz, cn);
  M.show(label(c, 'clean, steady, wrong', 1800, 520, 'lbl acc', 'right'), cn);
}
{
  const c = cam(2);
  const ys = word(2, 'yes'), rl = word(2, 'really'), ln = word(2, 'linear'), fs = word(2, 'step');
  M.show(label(c, 'a patient who can’t hear 5,000 Hz:', 960, 40, 'lbl s', 'center'), sceneStart(2));
  M.show(label(c, '“Yes, I hear it.”', 960, 110, 'note', 'center'), ys);
  M.show(cross(c, 1250, 150), ys + 6);
  const K = chain(c, ['whistle', 'microphone', 'sampler', 'boost', 'earpiece'], 45, 400, 342, 130, 28);
  K.sels.forEach((s, i) => M.show(s, sceneStart(2) + 20 + i * 4));
  K.arrows.forEach((s, i) => M.show(s, sceneStart(2) + 22 + i * 4));
  M.show(label(c, '5,000 Hz', K.x(0) + 171, 560, 'lbl', 'center'), rl);
  M.show(tick(c, K.x(0) + 146, 680), rl);
  M.show(label(c, 'linear,', K.x(3) + 171, 560, 'lbl s', 'center'), ln);
  M.show(label(c, 'time-invariant', K.x(3) + 171, 618, 'lbl s', 'center'), ln);
  M.show(label(c, 'no new tones', K.x(3) + 171, 690, 'lbl', 'center'), ln + 20);
  M.show(tick(c, K.x(3) + 146, 790), ln + 20);
  const hot = box(c, 'sampler', K.x(2), 400, 342, 130, 'box hot');
  M.show(hot, fs);
    M.show(layer(c, `<path d="M ${K.x(2) + 171} 270 L ${K.x(2) + 171} 380" stroke="${C.accent}" stroke-width="6"/><polygon points="${K.x(2) + 171},392 ${K.x(2) + 157},366 ${K.x(2) + 185},366" fill="${C.accent}"/>`), fs);
  M.show(label(c, 'where sound becomes numbers', K.x(2) + 171, 200, 'lbl acc', 'center'), fs);
  drift(2);
}
{
  const c = cam(3), x0 = 310, dx = 168, base = 420, A = 175, X = n => x0 + n * dx, Y = v => base - v * A;
  const tt = word(3, 'true'), et = word(3, '8'), sr = word(3, 'sampling'), lk = word(3, 'looks'), st = word(3, 'stores'), sv = word(3, 'survives');
  const wpts = []; for (let t = -0.3; t <= 8.3; t += 0.02) wpts.push([X(t), Y(cosd(45 * t))]);
  const wave = layer(c, `<path d="${path(wpts)}" ${WAVE.true}/>`, [X(-0.3) - 10, X(8.3) + 10]);
  reveal(wave, tt - 4, tt + 40, 'cruise');
  M.kf(wave, 'opacity', [[0, 1], [sv, 1], [sv + 20, 0.18, 'softInOut']]);
  layer(c, hline(X(-0.4), X(8.4), base));
  label(c, '1', X(-0.4) - 16, Y(1) - 29, 'lbl s', 'right'); label(c, '−1', X(-0.4) - 16, Y(-1) - 29, 'lbl s', 'right');
  M.show(label(c, 'the true tone, 1,000 Hz', 960, 30, 'lbl', 'center'), tt);
  M.show(layer(c, Array.from({ length: 8 }, (_, n) => `<rect x="${X(n) + 14}" y="${Y(1.15)}" width="${dx - 28}" height="${2.3 * A}" fill="${C.rule}" opacity="0.55"/>`).join('')), lk);
  M.show(label(c, 'the phone looks away', 960, 800, 'lbl s', 'center'), lk);
  M.show(layer(c, hline(X(0), X(1), 200, C.ink, 3) + vline(X(0), 188, 212, C.ink, 3) + vline(X(1), 188, 212, C.ink, 3)), et);
  M.show(label(c, '125 µs', X(1) + 20, 170, 'lbl s'), et);
  const gap = 7, first = et + 4;
  const ph = layer(c, vline(X(0), Y(1.2), base + 10, C.ink, 2));
  M.show(ph, first, first + 8 * gap + 6);
  M.kf(ph, 'x', [[0, 0], [first, 0], [first + 8 * gap, 8 * dx]]);
  for (let n = 0; n <= 8; n++) {
    const v = cosd(45 * n), at = first + n * gap;
    stem(c, X(n), base, Y(v), at);
    label(c, String(n), X(n), 625, 'lbl s', 'center');
    M.show(label(c, num(v), X(n), 705, 'lbl', 'center'), st + n * 2);
  }
  label(c, 'n', X(0) - 70, 625, 'lbl s', 'right');
  M.show(label(c, 'stores', X(0) - 70, 705, 'lbl acc', 'right'), st);
  M.show(label(c, '8,000 samples a second: the sampling rate', 960, 96, 'lbl s', 'center'), sr);
  drift(3);
}
{
  const c = cam(4), x0 = 400, dx = 160, base = 330, A = 170, X = n => x0 + n * dx, Y = v => base - v * A;
  const w5 = word(4, 'whistle'), r3 = word(4, 'real'), sl = word(4, 'same'), dd = word(4, 'dots');
  const said5 = [word(4, '1'), word(4, ['minus', '-0', '−']), word(4, ['zero', '0'], 0), word(4, ['point', '0.7', '.7'], 1)];
  layer(c, hline(X(-0.3), X(8.3), base));
  const p5 = [], p3 = []; for (let t = -0.25; t <= 8.25; t += 0.01) { p5.push([X(t), Y(cosd(225 * t))]); p3.push([X(t), Y(cosd(135 * t))]); }
  const W5 = layer(c, `<path d="${path(p5)}" ${WAVE.true}/>`, [X(-0.25) - 10, X(8.25) + 10]);
  reveal(W5, w5, w5 + 30, 'cruise');
  const r3a = r3 + 2, r3b = r3 + 50;
  const W3 = layer(c, `<path d="${path(p3)}" ${WAVE.acc}/>`, [X(-0.25) - 10, X(8.25) + 10]);
  reveal(W3, r3a, r3b, 'linear');
  M.show(label(c, '5,000 Hz', 300, 605, 'lbl', 'right'), w5);
  M.show(label(c, '3,000 Hz', 300, 685, 'lbl acc', 'right'), r3);
  const said3 = [word(4, '1', 1), word(4, ['minus', '-0', '−'], 1), word(4, ['zero', '0'], 1), word(4, ['point', '0.7', '.7'], 3)];

    stem(c, X(n), base, Y(v), at);

    M.show(label(c, num(v), X(n), 605, 'lbl', 'center'), at);

    const ring = layer(c, `<circle cx="${X(n)}" cy="${Y(v)}" r="30" fill="none" stroke="${C.accent}" stroke-width="5"/>`), pass = r3a + Math.round((r3b - r3a) * (n + 0.25) / 8.5);
    M.show(ring, pass, pass + 10);
  }
  label(c, 'n', 300, 520, 'lbl s', 'right');
  M.show(tick(c, 1180, 820), sl, dd);
  layer(c, `<line x1="300" y1="70" x2="370" y2="70" ${WAVE.true}/>`);
  M.show(label(c, 'the whistle, 5,000 Hz', 390, 40, 'lbl s'), sceneStart(4));
  M.show(layer(c, `<line x1="1080" y1="70" x2="1150" y2="70" ${WAVE.acc}/>`), r3);
  M.show(label(c, '3,000 Hz', 1170, 40, 'lbl s'), r3);
  M.show(label(c, 'the same list', 960, 780, 'lbl ok', 'center'), sl, dd);
  M.show(label(c, 'two waves, one set of dots', 960, 780, 'lbl', 'center'), dd);

}
{

  const ft = word(5, ['45', 'forty']), lr = word(5, 'left'), t3 = word(5, '3000'), tw = word(5, 'whistle'), mr = word(5, 'mirror'), rd = word(5, 'reading');
