<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Exchange That Moved</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="./runtime/fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=block">
<style>
:root {
  --paper: #F6F1E7;
  --paper-2: #ECE4D6;
  --ink: #26272B;
  --ink-soft: #5E5F66;
  --rule: #D9D0C1;
  --accent: #D9573B;
  --accent-ink: #B23F25;
  --accent-soft: #F6D9CF;
  --input: #2F7F7A;
  --input-soft: #D3E7E4;
  --sans: "Geist", "Inter", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --serif: "Instrument Serif", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#main { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 500; }
.scene, .cam, .layer { position: absolute; inset: 0; }
.layer svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
.reveal { --p: 0; --x0: 0px; --w: 1920px; clip-path: inset(-2000px calc(1920px - var(--x0) - var(--p) * var(--w)) -2000px -2000px); }
.lbl { position: absolute; font-family: var(--mono); font-size: 52px; line-height: 62px; white-space: pre; color: var(--ink); }
.lbl.s { font-size: 48px; line-height: 58px; color: var(--ink-soft); }
.lbl.acc { color: var(--accent-ink); }
.lbl.ok { color: var(--input); }
.lbl.big { font-size: 80px; line-height: 96px; }
.lbl.m { font-size: 48px; line-height: 58px; }
.note { position: absolute; font-family: var(--serif); font-style: italic; font-size: 64px; line-height: 76px; white-space: pre; color: var(--ink-soft); }
.note.acc { color: var(--accent-ink); }
.note.big { font-size: 96px; line-height: 110px; color: var(--accent-ink); }
</style>
</head>
<body>
<div id="main"></div>

<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const SCHEDULE = /*SCHEDULE*/null;
const FPS = 30;
const M = Motion.film({ fps: FPS, duration: SCHEDULE.duration, width: 1920, height: 1080, clock: 'smooth' });
const C = { ink: '#26272B', soft: '#5E5F66', rule: '#D9D0C1', accent: '#D9573B', accentInk: '#B23F25', accentSoft: '#F6D9CF', input: '#2F7F7A', inputSoft: '#D3E7E4', paper: '#F6F1E7', paper2: '#ECE4D6' };
const main = document.getElementById('main');
const LEAD = 9;
const END = Math.round(SCHEDULE.duration * FPS);
const lineStart = i => SCHEDULE.lines[i - 1].start_frame;
const sceneStart = i => Math.max(0, lineStart(i) - LEAD);
const sceneEnd = i => i < SCHEDULE.lines.length ? sceneStart(i + 1) : END;
const MISSES = [];
const word = (i, forms, nth = 0) => {
  const fs = [].concat(forms);
  const hits = SCHEDULE.lines[i - 1].words.filter(w => { const t = w.word.toLowerCase().replace(/[^a-z0-9.,%'−-]/g, ''); return fs.some(f => t.startsWith(f)); });
  if (!hits[nth]) MISSES.push(`${i}:${fs[0]}:${nth}`);
  return (hits[nth] || hits[hits.length - 1] || { frame: lineStart(i) }).frame - 2;
};
let uid = 0;

const range = (a, b, s = 1) => { const o = []; for (let v = a; v <= b + 1e-9; v += s) o.push(v); return o; };
const path = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
const cosd = a => Math.cos(a * Math.PI / 180), sind = a => Math.sin(a * Math.PI / 180);
const pt = (cx, cy, R, a) => [cx + R * cosd(a), cy - R * sind(a)];
const arcD = (cx, cy, r, a0, a1) => {
  const dir = a1 >= a0 ? 1 : -1, sweep = dir > 0 ? 0 : 1;
  let a = a0, d = 'M' + pt(cx, cy, r, a0).map(v => v.toFixed(1)).join(' ');
  while (Math.abs(a1 - a) > 1e-9) { const b = dir > 0 ? Math.min(a + 170, a1) : Math.max(a - 170, a1); d += `A${r} ${r} 0 0 ${sweep} ${pt(cx, cy, r, b).map(v => v.toFixed(1)).join(' ')}`; a = b; }
  return d;
};

function el(tag, attrs, parent, html) { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html !== undefined) e.innerHTML = html; parent.appendChild(e); return e; }
const SCENES = Array.from({ length: SCHEDULE.lines.length }, (_, i) => 's' + (i + 1));
SCENES.forEach(id => { const s = el('section', { id, class: 'scene' }, main); el('div', { id: id + 'cam', class: 'cam' }, s); });
const cam = n => document.getElementById(`s${n}cam`);
function sub(parent) { const id = 'P' + (++uid); el('div', { id, class: 'layer' }, parent); return document.getElementById(id); }
function layer(parent, inner, reveal) {
  const id = 'L' + (++uid), d = el('div', { id, class: 'layer' + (reveal ? ' reveal' : '') }, parent);
  if (reveal) { d.style.setProperty('--x0', reveal[0] + 'px'); d.style.setProperty('--w', (reveal[1] - reveal[0]) + 'px'); }
  d.innerHTML = `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  return '#' + id;
}
function label(parent, text, x, y, cls = 'lbl', anchor = 'left') {
  const id = 'T' + (++uid), e = el('div', { id, class: cls }, parent); e.textContent = text; e.style.top = y + 'px';
  if (anchor === 'left') e.style.left = x + 'px'; else if (anchor === 'right') e.style.right = (1920 - x) + 'px'; else { e.style.left = (x - 900) + 'px'; e.style.width = '1800px'; e.style.textAlign = 'center'; }
  return '#' + id;
}
const reveal = (sel, a, b, ease = 'softInOut') => M.kf(sel, '--p', [[0, 0], [a, 0], [b, 1, ease]]);
const origin = (sel, x, y) => { document.querySelector(sel).style.transformOrigin = `${x}px ${y}px`; };
const drift = (n, a = 1, b = 1.015) => M.drift(`#s${n}cam`, { prop: 'scale', from: a, to: b, start: sceneStart(n), end: sceneEnd(n) });
const grow = (sel, x, y, at, len = 8) => { origin(sel, x, y); M.show(sel, at); M.kf(sel, 'scaleY', [[0, 0], [at, 0], [at + len, 1, 'softLand']]); return sel; };
const fadeIn = (sel, at, len = 10) => { M.show(sel, at); M.kf(sel, 'opacity', [[0, 0], [at, 0], [at + len, 1]]); return sel; };

const hline = (x1, x2, y, color = C.soft, w = 3, dash = '') => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const vline = (x, y1, y2, color = C.soft, w = 3, dash = '') => `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${color}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const seg = (x1, y1, x2, y2, color = C.ink, w = 5, dash = '') => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const curve = (pts, color = C.ink, w = 5, dash = '') => `<path d="${path(pts)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const DASH = '16 11', DASHDOT = '26 10 6 10', DOTS = '2 12';
const stemSvg = (x, base, y, color = C.ink, w = 7, r = 15) => `<line x1="${x.toFixed(1)}" y1="${base}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${color}"/>`;
const zeroSvg = (x, y, r = 20, color = C.ink) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${C.paper}" stroke="${color}" stroke-width="6"/>`;
const poleSvg = (x, y, s = 18, color = C.ink) => seg(x - s, y - s, x + s, y + s, color, 7) + seg(x - s, y + s, x + s, y - s, color, 7);
const dotSvg = (x, y, r = 16, color = C.ink) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${color}"/>`;
const ringSvg = (x, y, r = 16, color = C.ink, w = 5) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${C.paper}" stroke="${color}" stroke-width="${w}"/>`;
function tick(c, x, y, s = 1) { return layer(c, `<path d="M ${x} ${y} l ${16 * s} ${18 * s} l ${34 * s} ${-40 * s}" fill="none" stroke="${C.input}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`); }
const rnd = k => { const v = Math.sin(k * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
const flicker = (sel, a, b, lo = 0.75, seed = 0) => { const keys = [[0, 1], [a, 1]]; for (let f = a + 2; f < b - 2; f += 2) keys.push([f, lo + (1 - lo) * rnd(f + seed)]); keys.push([b, 1]); M.kf(sel, 'opacity', keys); };
const bracket = (x1, x2, y, color = C.accent, h = 16, w = 5) => `<path d="M${x1.toFixed(1)} ${y - h}V${y}H${x2.toFixed(1)}V${y - h}" fill="none" stroke="${color}" stroke-width="${w}"/>`;
function axes(c, X, Y, xs, ys, x0, x1, y0, y1, title) {
  layer(c, hline(X(x0), X(x1) + 20, Y(y0), C.ink, 3) + vline(X(x0), Y(y0), Y(y1) - 20, C.ink, 3));
  xs.forEach(([v, t]) => { layer(c, vline(X(v), Y(y0), Y(y0) + 12, C.ink, 3)); label(c, t, X(v), Y(y0) + 36, 'lbl s', 'center'); });
  ys.forEach(([v, t]) => { layer(c, hline(X(x0) - 12, X(x0), Y(v), C.ink, 3)); label(c, t, X(x0) - 22, Y(v) - 29, 'lbl s', 'right'); });
  if (title) label(c, title, X(x0) - 22, Y(y1) - 112, 'lbl s');
}

const arrowSvg = (x1, y1, x2, y2, color = C.ink, w = 6, dash = '', open = false) => {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 26, s = 13;
  const bx = x2 - h * Math.cos(a), by = y2 - h * Math.sin(a);
  const p1 = [bx + s * Math.sin(a), by - s * Math.cos(a)], p2 = [bx - s * Math.sin(a), by + s * Math.cos(a)];
  return seg(x1, y1, bx, by, color, w, dash) + `<path d="M${x2.toFixed(1)} ${y2.toFixed(1)}L${p1[0].toFixed(1)} ${p1[1].toFixed(1)}L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}Z" fill="${open ? C.paper : color}" stroke="${color}" stroke-width="4" stroke-linejoin="round"/>`;
};
const stepped = (c, a, b, stepF, draw) => {
  const n = Math.max(1, Math.floor((b - a) / stepF));
  for (let k = 0; k <= n; k++) { const from = a + k * stepF, to = k === n ? b : a + (k + 1) * stepF; M.show(layer(c, draw(k / n)), from, to > from ? to : from + 1); }
};
const FS = 8000;
const T = f => FS / Math.PI * Math.tan(Math.PI * f / FS);
const A = F => FS / Math.PI * Math.atan(Math.PI * F / FS);
const G = (F, c) => 1 / Math.sqrt(1 + (F / c) ** 4);
const PRE = T(3400);
const exch = f => G(f, 3400), bugCopy = f => G(T(f), 3400), fixCopy = f => G(T(f), PRE);
const hz = v => Math.round(v).toLocaleString('en-US');
const pct = v => (100 * v).toFixed(1) + '%';
const sq = (x, y, s = 13, color = C.accent) => `<rect x="${(x - s).toFixed(1)}" y="${(y - s).toFixed(1)}" width="${2 * s}" height="${2 * s}" fill="${C.paper}" stroke="${color}" stroke-width="5"/>`;
const box = (x, y, w, h, stroke = C.ink, fill = C.paper, sw = 4) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" rx="8"/>`;

{
  const c = cam(1);
  const sw = word(1, 'switched'), sa = word(1, 'same'), ma = word(1, 'manual'), bu = word(1, 'butterworth'), cu = word(1, ['cutoff', 'cut']), sc = word(1, 'script'), di = word(1, 'digital', 1), re = word(1, 'recipe');
  label(c, 'the old analog exchange', 160, 70, 'lbl s');
  const racks = [160, 400, 640].map(x => box(x, 150, 200, 560, C.ink, C.paper2) + range(0, 5).map(r => `<circle cx="${x + 50}" cy="${200 + r * 96}" r="16" fill="${C.paper}" stroke="${C.ink}" stroke-width="4"/>` + `<path d="M${x + 95} ${200 + r * 96}${range(0, 5).map(k => `l10 ${k % 2 ? 14 : -14}`).join('')}" fill="none" stroke="${C.soft}" stroke-width="4"/>`).join('')).join('');
  layer(c, racks);
  stepped(c, 0, sw, 6, p => [160, 400, 640].map((x, i) => range(0, 5).filter(r => rnd(Math.round(p * 1000) + i * 7 + r * 13) > 0.6).map(r => dotSvg(x + 50, 200 + r * 96, 10, C.accent)).join('')).join(''));
  M.show(label(c, 'switched off this month', 160, 750, 'lbl acc'), sw);
  M.show(label(c, 'goal: sound the same', 1000, 70, 'lbl ok'), sa);
  fadeIn(layer(c, box(1000, 150, 760, 420)), ma - 4, 8);
  M.show(label(c, 'the manual', 1030, 170, 'lbl s'), ma);
  M.show(label(c, 'line filter: low-pass', 1030, 260, 'lbl'), ma + 6);
  M.show(label(c, 'Butterworth', 1030, 340, 'lbl'), bu);
  M.show(label(c, 'cutoff: 3,400 Hz', 1030, 420, 'lbl'), cu);
  M.show(label(c, 'where it passes 71%', 1030, 490, 'lbl s'), word(1, 'passes'));
  M.show(layer(c, arrowSvg(1380, 578, 1380, 640, C.ink, 5)), sc);
  fadeIn(layer(c, box(1000, 650, 760, 110, C.accent)), sc, 8);
  M.show(label(c, 'script: textbook recipe', 1030, 674, 'lbl'), sc);
  M.show(label(c, '→ a digital filter', 1000, 790, 'lbl acc'), Math.min(di, re));
  drift(1);
}
{
  const c = cam(2);
  const pl = word(2, 'plays'), th = word(2, ['thousand', '1000', '1,000', '1']), pe = word(2, 'perfect'), se = word(2, ['seventy', '71']), te = word(2, ['ten', '10']), du = word(2, 'dull'), fr = word(2, 'frequencies');
  const X = f => 300 + f * 0.3, Y = g => 800 - g * 520;
  axes(c, X, Y, [[0, '0'], [1000, '1,000'], [2000, '2,000'], [3000, '3,000'], [4000, '4,000 Hz']], [[0, '0%'], [0.5, '50%'], [1, '100%']], 0, 4000, 0, 1.08, '');
  label(c, 'the technician’s tones', 300, 70, 'lbl s');
  M.show(label(c, 'solid: the exchange   dashed: your copy', 300, 130, 'lbl s'), pl);
  const ex = layer(c, curve(range(0, 4000, 10).map(f => [X(f), Y(exch(f))]), C.ink, 5), [X(0) - 6, X(4000) + 6]);
  reveal(ex, pl, pl + 30, 'cruise');
  const cp = layer(c, curve(range(0, 4000, 10).map(f => [X(f), Y(bugCopy(f))]), C.accent, 5, DASH), [X(0) - 6, X(4000) + 6]);
  reveal(cp, pl + 20, pl + 50, 'cruise');
  flicker(cp, pl + 50, sceneEnd(2), 0.75, 5);
  M.show(layer(c, hline(X(0), X(4000), Y(0.7071), C.soft, 3, '6 10')), se);
  M.show(label(c, '71%', X(4000) + 24, Y(0.7071) - 29, 'lbl s'), se);
  M.show(layer(c, sq(X(1000), Y(bugCopy(1000)), 19) + dotSvg(X(1000), Y(exch(1000)), 10)), th);
  M.show(label(c, '1,000 Hz: 99.6% and 99.5%', 340, 190, 'lbl'), th);
  M.show(tick(c, 1180, 230), pe);
  M.show(layer(c, dotSvg(X(3400), Y(exch(3400)), 13)), se);
  M.show(label(c, pct(exch(3400)), X(3400) + 30, Y(exch(3400)) - 82, 'lbl'), se);
  M.show(layer(c, sq(X(3400), Y(bugCopy(3400)))), te);
  M.show(label(c, pct(bugCopy(3400)), X(3400) + 30, Y(bugCopy(3400)) - 82, 'lbl acc'), te);
  M.show(label(c, 'callers: dull', 1800, 500, 'lbl acc', 'right'), du);
  M.show(label(c, '?', 1730, 160, 'lbl big acc'), fr);
  drift(2);
}
{
  const c = cam(3);
  const vo = word(3, 'voltage'), ca = word(3, 'capacitors'), an = word(3, 'analog'), wh = word(3, 'wheel'), li = word(3, 'limit'), re = word(3, 'response'), mi = word(3, ['million', '1000000', '1,000,000']), be = word(3, 'beyond');
  const yW = 330;
  const sig = (t, hi) => 0.55 * Math.sin(t) + 0.3 * Math.sin(2.3 * t + 1) + hi * 0.25 * Math.sin(6.1 * t + 2);
  const wave = (x0, x1, amp, hi, ph) => curve(range(x0, x1, 4).map(x => [x, yW - amp * sig(x / 40 + ph, hi)]), C.input, 5);
  layer(c, box(700, 220, 420, 220, C.ink, C.paper2));
  layer(c, vline(830, 280, 380, C.ink, 7) + vline(860, 280, 380, C.ink, 7) + `<path d="M930 ${yW}${range(0, 7).map(k => `a18 18 0 0 1 ${24} 0`).join('')}" fill="none" stroke="${C.ink}" stroke-width="5"/>`);
  stepped(c, sceneStart(3), sceneEnd(3), 2, p => wave(160, 660, 90, 1, p * 40) + wave(1160, 1760, 80, 0.2, p * 40 - 1));
  label(c, 'voltage, every instant', 160, 160, 'lbl s');
  M.show(label(c, 'capacitors + coils', 910, 460, 'lbl s', 'center'), ca);
  M.show(label(c, 'analog filter', 910, 60, 'lbl big acc', 'center'), an);
  const R = F => 160 + Math.log10(F / 10) * 260, yR = 700;
  const sa3 = word(3, 'samples');
  const ruler = layer(c, hline(R(10), 1780, yR, C.ink, 4) + arrowSvg(1700, yR, 1800, yR, C.ink, 4) + [10, 100, 1e3, 1e4, 1e5, 1e6].map(F => vline(R(F), yR - 18, yR + 18, C.ink, 4)).join(''), [140, 1820]);
  reveal(ruler, sa3, sa3 + 16, 'cruise');
  M.show(label(c, 'response at every frequency, Hz', 160, 560, 'lbl s'), re);
  M.show(label(c, 'log: each tick ×10', 160, 620, 'lbl s'), sa3);
  [[10, '10'], [1e3, '1,000'], [1e4, '10,000'], [1e6, '1,000,000']].forEach(([F, t], i) => M.show(label(c, t, R(F), yR + 30, 'lbl s', 'center'), sa3 + 4 * i));
  M.show(layer(c, vline(R(4000), yR - 90, yR + 20, C.accent, 5, '10 8')), Math.max(wh, sa3 + 18));
  M.show(label(c, 'samples stop at 4,000', R(4000), 800, 'lbl acc', 'center'), Math.max(wh, sa3 + 18));
  M.show(label(c, 'no limit', 1800, 580, 'lbl ok', 'right'), Math.max(li, sa3 + 20));
  M.show(layer(c, dotSvg(R(1e6), yR, 14, C.input)), mi);
  M.show(label(c, '→ ∞', 1800, 760, 'lbl ok', 'right'), be);
  drift(3);
}
{
  const c = cam(4);
  const ru = word(4, 'ruler'), fo = word(4, 'forever'), ha = word(4, 'half'), wr = word(4, 'wrap'), fi = word(4, ['five', '5000', '5,000']), al = word(4, 'aliasing'), be = word(4, 'bend'), sq2 = word(4, 'squeeze');
  const XR = F => 160 + F * 0.13, yR = 170;
  const rl = layer(c, hline(XR(0), XR(12000), yR, C.ink, 4) + arrowSvg(XR(12000), yR, 1840, yR, C.ink, 4) + range(0, 12000, 1000).map(F => vline(XR(F), yR - 14, yR + 14, C.ink, 4)).join(''), [140, 1860]);
  reveal(rl, sceneStart(4), ru + 20, 'cruise');
  [[0, '0'], [3000, '3,000'], [5000, '5,000'], [10000, '10,000 Hz']].forEach(([F, t]) => M.show(label(c, t, XR(F), yR + 26, 'lbl s', 'center'), ru));
  label(c, 'analog: a ruler', 160, 70, 'lbl s');
  M.show(label(c, 'on forever', 1800, 96, 'lbl ok', 'right'), fo);
  const cy = 760, s1 = sub(c);
  M.show('#' + s1.id, ha, wr);
  const halfC = (cx, R0) => `<path d="${arcD(cx, cy, R0, 0, 180)}" fill="none" stroke="${C.ink}" stroke-width="5"/>` + hline(cx - R0 - 50, cx + R0 + 50, cy, C.rule, 3);
  layer(s1, halfC(960, 260));
  label(s1, 'digital: half the wheel', 960, 330, 'lbl s', 'center');
  label(s1, '0 Hz', 960 + 260, cy + 20, 'lbl s', 'center');
  label(s1, '2,000', 960, cy - 260 - 80, 'lbl s', 'center');
  label(s1, '4,000 Hz', 960 - 260, cy + 20, 'lbl s', 'center');
  const s2 = sub(c);

  const cw = 520, ringR = [200, 235, 270];
  label(s2, 'wrap', cw, 290, 'lbl', 'center');
  const ringAng = F => { const k = Math.floor(F / 4000), r = F - 4000 * k; return k % 2 ? 180 - 180 * r / 4000 : 180 * r / 4000; };
  const ringRad = F => ringR[Math.min(2, Math.floor(F / 4000))];
  layer(s2, hline(cw - 330, cw + 330, cy, C.rule, 3));
