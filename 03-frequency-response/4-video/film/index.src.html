<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Wall on the Line</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="./runtime/fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=block">
<style>
:root {
  --paper: #F6F1E7;
  --paper-2: #ECE4D6;
  --ink: #26272B;
  --ink-soft: #5E5F66;
  --rule: #D9D0C1;
  --accent: #D9573B;
  --accent-ink: #B23F25;
  --accent-soft: #F6D9CF;
  --input: #2F7F7A;
  --input-soft: #D3E7E4;
  --sans: "Geist", "Inter", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --serif: "Instrument Serif", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#main { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 500; }
.scene, .cam, .layer { position: absolute; inset: 0; }
.layer svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
.reveal { --p: 0; --x0: 0px; --w: 1920px; clip-path: inset(-2000px calc(1920px - var(--x0) - var(--p) * var(--w)) -2000px -2000px); }
.lbl { position: absolute; font-family: var(--mono); font-size: 52px; line-height: 62px; white-space: pre; color: var(--ink); }
.lbl.s { font-size: 48px; line-height: 58px; color: var(--ink-soft); }
.lbl.acc { color: var(--accent-ink); }
.lbl.ok { color: var(--input); }
.lbl.big { font-size: 80px; line-height: 96px; }
.note { position: absolute; font-family: var(--serif); font-style: italic; font-size: 64px; line-height: 76px; white-space: pre; color: var(--ink-soft); }
.dot { position: absolute; border-radius: 50%; }
.box { position: absolute; background: var(--paper-2); border: 4px solid var(--ink); border-radius: 10px; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--mono); font-size: 50px; line-height: 62px; white-space: pre; }
</style>
</head>
<body>
<div id="main"></div>

<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const SCHEDULE = /*SCHEDULE*/null;
const FPS = 30;
const M = Motion.film({ fps: FPS, duration: SCHEDULE.duration, width: 1920, height: 1080, clock: 'smooth' });
const C = { ink: '#26272B', soft: '#5E5F66', rule: '#D9D0C1', accent: '#D9573B', accentInk: '#B23F25', accentSoft: '#F6D9CF', input: '#2F7F7A', inputSoft: '#D3E7E4', paper: '#F6F1E7', paper2: '#ECE4D6' };
const main = document.getElementById('main');
const LEAD = 9;
const END = Math.round(SCHEDULE.duration * FPS);
const lineStart = i => SCHEDULE.lines[i - 1].start_frame;
const sceneStart = i => Math.max(0, lineStart(i) - LEAD);
const sceneEnd = i => i < SCHEDULE.lines.length ? sceneStart(i + 1) : END;
const MISSES = [];
const word = (i, forms, nth = 0) => {
  const fs = [].concat(forms);
  const hits = SCHEDULE.lines[i - 1].words.filter(w => { const t = w.word.toLowerCase().replace(/[^a-z0-9.,%']/g, ''); return fs.some(f => t.startsWith(f)); });
  if (!hits[nth]) MISSES.push(`${i}:${fs[0]}:${nth}`);
  return (hits[nth] || hits[hits.length - 1] || { frame: lineStart(i) }).frame - 2;
};
let uid = 0;

const fmt = (v, d = 2) => (v < -0.0005 ? '−' : '') + Math.abs(v).toFixed(d);
const path = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
const cosd = a => Math.cos(a * Math.PI / 180), sind = a => Math.sin(a * Math.PI / 180);
const gain = f => 0.7 + 0.3 * cosd(360 * f / 8000);
const pt = (cx, cy, R, a) => [cx + R * cosd(a), cy - R * sind(a)];
const arcD = (cx, cy, r, a0, a1) => { const [x0, y0] = pt(cx, cy, r, a0), [x1, y1] = pt(cx, cy, r, a1); return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} ${a1 > a0 ? 0 : 1} ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
const wedgeD = (cx, cy, r, a0, a1) => { const [x0, y0] = pt(cx, cy, r, a0); return `M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}${arcD(cx, cy, r, a0, a1).replace(/^M[^A]+/, '')}Z`; };
const OUT2 = [0.558, 0.691, 0.719, -0.488, -0.029, -0.691, -1.248, -0.489];
const BANDS = [[500, 250, 750], [1000, 750, 1250], [1500, 1250, 1750], [2000, 1750, 2250], [2500, 2250, 2750], [3000, 2750, 3250], [3400, 3250, 3550]];

function el(tag, attrs, parent, html) { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html !== undefined) e.innerHTML = html; parent.appendChild(e); return e; }
const SCENES = Array.from({ length: SCHEDULE.lines.length }, (_, i) => 's' + (i + 1));
SCENES.forEach(id => { const s = el('section', { id, class: 'scene' }, main); el('div', { id: id + 'cam', class: 'cam' }, s); });
const cam = n => document.getElementById(`s${n}cam`);
function sub(parent) { const id = 'P' + (++uid); el('div', { id, class: 'layer' }, parent); return document.getElementById(id); }
function layer(parent, inner, reveal) {
  const id = 'L' + (++uid), d = el('div', { id, class: 'layer' + (reveal ? ' reveal' : '') }, parent);
  if (reveal) { d.style.setProperty('--x0', reveal[0] + 'px'); d.style.setProperty('--w', (reveal[1] - reveal[0]) + 'px'); }
  d.innerHTML = `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  return '#' + id;
}
function label(parent, text, x, y, cls = 'lbl', anchor = 'left') {
  const id = 'T' + (++uid), e = el('div', { id, class: cls }, parent); e.textContent = text; e.style.top = y + 'px';
  if (anchor === 'left') e.style.left = x + 'px'; else if (anchor === 'right') e.style.right = (1920 - x) + 'px'; else { e.style.left = (x - 900) + 'px'; e.style.width = '1800px'; e.style.textAlign = 'center'; }
  return '#' + id;
}
function box(parent, text, x, y, w, h, cls = 'box') {
  const id = 'X' + (++uid), e = el('div', { id, class: cls }, parent); e.textContent = text;
  Object.assign(e.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  return '#' + id;
}
function dot(parent, x, y, r, color, hollow) {
  const id = 'D' + (++uid), e = el('div', { id, class: 'dot' }, parent);
  Object.assign(e.style, { left: (x - r) + 'px', top: (y - r) + 'px', width: 2 * r + 'px', height: 2 * r + 'px', background: hollow ? C.paper : color, border: hollow ? `5px solid ${color}` : 'none' });
  return '#' + id;
}
const reveal = (sel, a, b, ease = 'softInOut') => M.kf(sel, '--p', [[0, 0], [a, 0], [b, 1, ease]]);
const travel = (sel, pts) => { M.kf(sel, 'x', pts.map(([f, x, , e]) => [f, x, e])); M.kf(sel, 'y', pts.map(([f, , y, e]) => [f, y, e])); };
const origin = (sel, x, y) => { document.querySelector(sel).style.transformOrigin = `${x}px ${y}px`; };
const drift = (n, a = 1, b = 1.03) => M.drift(`#s${n}cam`, { prop: 'scale', from: a, to: b, start: sceneStart(n), end: sceneEnd(n) });

function plot({ x0, dx, base, A }) { return { X: n => x0 + n * dx, Y: v => base - v * A, x0, dx, base, A }; }
const hline = (x1, x2, y, color = C.soft, w = 3, dash = '') => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const zeroDot = (x, y) => `<circle cx="${x}" cy="${y}" r="7" fill="${C.soft}"/>`;
const stemSvg = (x, base, y, kind) => kind === 'in'
  ? `<line x1="${x}" y1="${base}" x2="${x}" y2="${y}" stroke="${C.soft}" stroke-width="5" stroke-dasharray="12 10"/><circle cx="${x}" cy="${y}" r="15" fill="${C.paper}" stroke="${C.soft}" stroke-width="5"/>`
  : kind === 'acc'
    ? `<line x1="${x}" y1="${base}" x2="${x}" y2="${y}" stroke="${C.accent}" stroke-width="9" stroke-linecap="round"/>`
    : `<line x1="${x}" y1="${base}" x2="${x}" y2="${y}" stroke="${C.ink}" stroke-width="8" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="15" fill="${C.ink}"/>`;
function stem(c, x, base, y, kind, at) {
  const sel = layer(c, stemSvg(x, base, y, kind));
  if (at !== undefined) { origin(sel, x, base); M.show(sel, at); M.kf(sel, 'scaleY', [[0, 0], [at, 0], [at + 10, 1, 'softLand']]); }
  return sel;
}
const head = (x1, y1, x2, y2, len, half) => {
  const d = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / d, uy = (y2 - y1) / d, bx = x2 - ux * len, by = y2 - uy * len;
  return { bx, by, pts: `${x2.toFixed(1)},${y2.toFixed(1)} ${(bx - uy * half).toFixed(1)},${(by + ux * half).toFixed(1)} ${(bx + uy * half).toFixed(1)},${(by - ux * half).toFixed(1)}` };
};
const vecSvg = (x1, y1, x2, y2, color = C.ink, w = 7) => { const h = head(x1, y1, x2, y2, 30, 15); return `<line x1="${x1}" y1="${y1}" x2="${h.bx.toFixed(1)}" y2="${h.by.toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${h.pts}" fill="${color}"/>`; };
const arrowHead = (x, y, dir, color) => { const s = dir === 'r' ? -1 : 1; return `<path d="M ${x + s * 22} ${y - 14} L ${x} ${y} L ${x + s * 22} ${y + 14}" fill="none" stroke="${color}" stroke-width="5" stroke-linejoin="round"/>`; };
function tick(c, x, y, s = 1) { return layer(c, `<path d="M ${x} ${y} l ${16 * s} ${18 * s} l ${34 * s} ${-40 * s}" fill="none" stroke="${C.input}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`); }
function cross(c, x, y, s = 1) { return layer(c, `<g stroke="${C.accent}" stroke-width="9" stroke-linecap="round"><line x1="${x}" y1="${y - 20 * s}" x2="${x + 40 * s}" y2="${y + 20 * s}"/><line x1="${x + 40 * s}" y1="${y - 20 * s}" x2="${x}" y2="${y + 20 * s}"/></g>`); }
function steps(sel, deg, frames, len = 6) {
  const keys = [[0, 0]];
  frames.forEach((f, i) => { keys.push([f, -deg * i]); keys.push([f + len, -deg * (i + 1), 'softInOut']); });
  M.kf(sel, 'rotation', keys);
}

function callWaves(c, yc, amp, from, to, at, x0, len) {
  const crisp = [], soft = [];
  for (let i = 0; i <= 4400; i += 2) {
    const x = -100 + i, u = (x + 100) / 800, env = Math.abs(Math.sin(Math.PI * u)) ** 1.2;
    const low = 0.62 * Math.sin(2 * Math.PI * 2.4 * u) + 0.3 * Math.sin(2 * Math.PI * 4.6 * u + 1.1);
    const high = 0.34 * Math.sin(2 * Math.PI * 21 * u + 0.4) + 0.22 * Math.sin(2 * Math.PI * 33 * u + 2.0);
    crisp.push([x, env * (low + high)]); soft.push([x, env * low]);
  }
  layer(c, hline(0, 1920, yc, C.rule));
  const strip = sub(c);
  M.kf('#' + strip.id, 'x', [[x0, 0], [x0 + len, -5 * len]]);
  const K = 14;
  for (let j = 0; j <= K; j++) {
    const k = from + (to - from) * j / K, pts = crisp.map(([x, v], i) => [x, yc - amp * ((1 - k) * v + k * soft[i][1])]);
    const on = j === 0 ? 0 : at + j * 2, off = j < K ? at + (j + 1) * 2 : undefined;
    M.show(layer(strip, `<path d="${path(pts)}" fill="none" stroke="${k > 0.5 ? C.soft : C.ink}" stroke-width="5" stroke-linejoin="round"/>`), on, off);
  }
}

{
  const c = cam(1), n = 0, s2 = sceneEnd(1);
  callWaves(c, 430, 220, 0, 1, word(1, 'edges'), n, s2 - n);
  M.show(label(c, 'the east route', 960, 30, 'lbl', 'center'), word(1, 'route'));
  M.show(label(c, 'old cable, smoothing circuit', 960, 100, 'lbl s', 'center'), word(1, 'cable'));
  const tk = word(1, 'tickets');
  M.show(label(c, 'no drops', 820, 760, 'lbl', 'right'), word(1, 'drops'), tk);
  M.show(tick(c, 840, 800), word(1, 'drops'), tk);
  M.show(label(c, 'no buzz', 1040, 760, 'lbl'), word(1, 'buzzes'), tk);
  M.show(tick(c, 1270, 800), word(1, 'buzzes'), tk);
  M.show(label(c, '“Like talking through a wall.”', 960, 690, 'note', 'center'), tk);
  M.show(label(c, 'every word: there', 820, 790, 'lbl ok', 'right'), word(1, 'word'));
  M.show(label(c, 'edges: gone', 900, 790, 'lbl acc'), word(1, 'edges'));
}
{
  const c = cam(2);
  const base = 600, A = 380;
  const XA = k => 200 + k * 110, XB = k => 1300 + k * 110;
  layer(c, hline(160, 680, base) + hline(1260, 1780, base) + [1, 2, 3, 4].map(k => zeroDot(XA(k), base)).join(''));
  box(c, 'the east route', 730, 520, 460, 160);
  layer(c, `<line x1="680" y1="600" x2="716" y2="600" stroke="${C.soft}" stroke-width="5"/>${arrowHead(718, 600, 'r', C.soft)}<line x1="1200" y1="600" x2="1236" y2="600" stroke="${C.soft}" stroke-width="5"/>${arrowHead(1238, 600, 'r', C.soft)}`);
  [0, 1, 2, 3, 4].forEach(k => { label(c, String(k), XA(k), 625, 'lbl s', 'center'); label(c, String(k), XB(k), 625, 'lbl s', 'center'); });
  label(c, 'n', 110, 625, 'lbl s');
  label(c, 'the click going in', 420, 130, 'lbl s', 'center');
  label(c, 'what comes back', 1520, 700, 'lbl s', 'center');
  M.show(label(c, 'linear', 780, 20, 'lbl', 'right'), word(2, 'linear'));
  M.show(tick(c, 800, 55), word(2, 'linear'));
  M.show(label(c, 'time-invariant', 900, 20, 'lbl'), word(2, 'time'));
  M.show(tick(c, 1360, 55), word(2, 'time'));
  const ck = word(2, 'click');
  stem(c, XA(0), base, base - A, 'in', ck);
  M.show(label(c, '1', XA(0) + 30, base - A - 30, 'lbl s'), ck + 6);
  const go = word(2, 'listen'), p = dot(c, 0, 0, 14, C.soft);
  M.show(p, go, go + 30);
  travel(p, [[go, 690, 600], [go + 12, 960, 600, 'softInOut'], [go + 28, 1240, 600, 'softInOut']]);
  const H = [0.15, 0.7, 0.15], at = [word(2, '.15'), word(2, '.7'), word(2, '.15', 1)];
  H.forEach((v, k) => {
    stem(c, XB(k), base, base - v * A, 'out', at[k]);
    M.show(label(c, fmt(v), XB(k), base - v * A - 82, 'lbl', 'center'), at[k]);
  });
  M.show(layer(c, [3, 4].map(k => zeroDot(XB(k), base)).join('')), at[2] + 8);
  M.show(label(c, 'where is “muffled”?', 960, 790, 'lbl acc', 'center'), word(2, 'muffled'));
  drift(2);
}
{
  const c = cam(3);
  const P = plot({ x0: 330, dx: 180, base: 470, A: 260 }), d = 24;
  const xin = k => [1, 0, -1, 0][k % 4], yout = k => 0.7 * xin(k + 3);
  layer(c, hline(270, 1690, P.base) + `<line x1="270" y1="${P.Y(0.7)}" x2="1690" y2="${P.Y(0.7)}" stroke="${C.soft}" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>`);
  [0, 1, 2, 3, 4, 5, 6, 7].forEach(k => label(c, String(k), P.X(k), 770, 'lbl s', 'center'));
  label(c, 'n', 230, 770, 'lbl s', 'right');
  label(c, '1', 230, P.Y(1) - 31, 'lbl s', 'right'); label(c, '−1', 230, P.Y(-1) - 31, 'lbl s', 'right');
  M.show(label(c, '2,000 Hz', 960, 30, 'lbl', 'center'), word(3, '2'), word(3, 'same', 1));
  M.show(label(c, '8,000 ÷ 2,000 = 4 samples per cycle', 960, 100, 'lbl s', 'center'), word(3, '8'), word(3, 'same', 1));
  const said = [word(3, '1'), word(3, ',0,'), word(3, 'minus'), word(3, ',0,', 1)];
  [0, 1, 2, 3, 4, 5, 6, 7].forEach(k => {
    const at = k < 4 ? said[k] : said[3] + 4 + (k - 4) * 3;
    if (xin(k)) stem(c, P.X(k) - d, P.base, P.Y(xin(k)), 'in', at); else M.show(layer(c, zeroDot(P.X(k) - d, P.base)), at);
  });
  const so = word(3, 'same');
  [0, 1, 2, 3, 4, 5, 6, 7].forEach(k => {
    const at = so + k * 3;
    if (yout(k)) stem(c, P.X(k) + d, P.base, P.Y(yout(k)), 'out', at); else M.show(layer(c, zeroDot(P.X(k) + d, P.base)), at);
  });
  const sv = word(3, '70'), bx = P.X(5) + 75;
  M.show(layer(c, `<g stroke="${C.accent}" stroke-width="5"><line x1="${bx}" y1="${P.base}" x2="${bx}" y2="${P.Y(0.7)}"/><line x1="${bx - 14}" y1="${P.Y(0.7)}" x2="${bx + 14}" y2="${P.Y(0.7)}"/><line x1="${bx - 14}" y1="${P.base}" x2="${bx + 14}" y2="${P.base}"/></g>`), sv);
  M.show(label(c, '70%', bx + 22, P.Y(0.35) - 31, 'lbl acc'), sv);
  const lt = word(3, 'late');
  M.show(layer(c, vecSvg(P.X(0) - d + 18, P.Y(1) - 6, P.X(1) + d - 18, P.Y(0.7) - 10, C.accent, 6)), lt);
  M.show(label(c, '1 sample later', P.X(1) + d + 30, P.Y(0.7) - 8, 'lbl s acc'), lt);
  layer(c, `<line x1="1740" y1="236" x2="1740" y2="290" stroke="${C.soft}" stroke-width="5" stroke-dasharray="8 6"/><circle cx="1740" cy="236" r="13" fill="${C.paper}" stroke="${C.soft}" stroke-width="5"/>`);
  M.show(layer(c, `<line x1="1740" y1="336" x2="1740" y2="390" stroke="${C.ink}" stroke-width="7"/><circle cx="1740" cy="336" r="13" fill="${C.ink}"/>`), so);
  label(c, 'in', 1770, 220, 'lbl s');
  M.show(label(c, 'out', 1770, 320, 'lbl'), so);
  const st = word(3, 'same', 1);
  M.show(label(c, '2,000 Hz in, 2,000 Hz out', 960, 30, 'lbl', 'center'), st);
  M.show(tick(c, 1390, 70), st);
  drift(3);
}
{
  const c = cam(4), R = 150, cy = 360, rowY = k => 560 + k * 44;
  const cells = [[1000, 400], [2000, 960], [4000, 1520]];
  const on = { 1000: word(4, '1000'), 2000: sceneStart(4), 4000: word(4, '4000') };
  const go = { 1000: on[1000] + 10, 2000: word(4, 'turning'), 4000: on[4000] + 8 };
  const gap = { 1000: 6, 2000: 10, 4000: 6 };
  cells.forEach(([f, cx]) => {
    const t = 360 * f / 8000, uniq = Math.round(360 / (t || 360)), g = sub(c), gs = '#' + g.id;
    M.show(gs, on[f]);
    const stops = Array.from({ length: Math.min(uniq, 8) }, (_, k) => { const [x, y] = pt(cx, cy, R, t * k); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="${C.soft}"/>`; }).join('');
    layer(g, hline(cx - R - 24, cx + R + 24, cy) + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${C.ink}" stroke-width="4"/>` + stops +
      `<line x1="${cx}" y1="${rowY(0) - 22}" x2="${cx}" y2="${rowY(7) + 22}" stroke="${C.soft}" stroke-width="3"/>` +
      [cx - R, cx + R].map(x => `<line x1="${x}" y1="${rowY(0) - 22}" x2="${x}" y2="${rowY(7) + 22}" stroke="${C.soft}" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>`).join(''));
    label(g, `${f.toLocaleString('en-US')} Hz  ${t}°`, cx, 120, f === 2000 ? 'lbl' : 'lbl s', 'center');
    const spin = layer(g, `<line x1="${cx}" y1="${cy}" x2="${cx + R}" y2="${cy}" stroke="${C.soft}" stroke-width="4" stroke-dasharray="10 8"/><circle cx="${cx + R}" cy="${cy}" r="20" fill="${C.accent}"/>`);
    origin(spin, cx, cy);
    const fr = Array.from({ length: 7 }, (_, k) => go[f] + k * gap[f]);
    steps(spin, t, fr);
    for (let k = 0; k < 8; k++) {
      const x = cx + R * cosd(t * k), at = k ? fr[k - 1] + 6 : (f === 2000 ? word(4, 'sample') : on[f] + 2);
      M.show(layer(g, `<line x1="${cx}" y1="${rowY(k)}" x2="${x.toFixed(1)}" y2="${rowY(k)}" stroke="${C.ink}" stroke-width="6"/><circle cx="${x.toFixed(1)}" cy="${rowY(k)}" r="10" fill="${C.ink}"/>`), at);
    }
  });
  const lr = word(4, 'left');
  M.show(label(c, '−1', 960 - R - 30, cy - 70, 'lbl s', 'right'), lr);
